<title>AI-rendszerek tervezése</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Elrendezés: bal oldalt az állomások; jobbra térkép → sávok → lépésfej → rajz | kód → magyarázat */
:root{
  --bg:#eceef1; --panel:#fafbfb; --panel-2:#e1e5ea; --ink:#17202b; --muted:#566170;
  --line:#cbd2da; --line-strong:#87929f;
  --accent:#0a6a70; --accent-soft:#d3eaeb;
  --hl:#d9970f; --hl-soft:#f7e5b5;
  --bad:#bb382c; --bad-soft:#f5dbd7; --ok:#2a7a46; --ok-soft:#d6ecdd;
  --code-bg:#151b23; --code-fg:#d9dfe8; --code-dim:#5f6a7a; --code-kw:#e9a46a; --code-ty:#7fc6cb;
  --code-str:#b0d38c; --code-com:#8391a3; --code-num:#d7b3f0;
  --code-hl:rgba(217,151,15,.17); --code-exec:rgba(217,151,15,.36);
  --bad-ink:#ff9384; --ok-ink:#82dca0; --acc-ink:#7fd3d8; --mut-ink:#9ba7b5;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --panel:#171e27; --panel-2:#222b36; --ink:#e2e7ed; --muted:#97a2b0;
    --line:#2a3440; --line-strong:#5e6b7b;
    --accent:#47b4ba; --accent-soft:#143337;
    --hl:#f0b33a; --hl-soft:#3b3015;
    --bad:#ec6b5d; --bad-soft:#3c1f1b; --ok:#5dbf7c; --ok-soft:#163120;
    --code-bg:#0b0f14; --code-fg:#d9dfe8; --code-dim:#556071; --code-kw:#e9a46a; --code-ty:#7fc6cb;
    --code-str:#b0d38c; --code-com:#7d8b9d; --code-num:#d7b3f0;
    --code-hl:rgba(240,179,58,.15); --code-exec:rgba(240,179,58,.32);
    --bad-ink:#b23a2e; --ok-ink:#21703f; --acc-ink:#0a6a70; --mut-ink:#566170;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#171e27; --panel-2:#222b36; --ink:#e2e7ed; --muted:#97a2b0;
  --line:#2a3440; --line-strong:#5e6b7b;
  --accent:#47b4ba; --accent-soft:#143337;
  --hl:#f0b33a; --hl-soft:#3b3015;
  --bad:#ec6b5d; --bad-soft:#3c1f1b; --ok:#5dbf7c; --ok-soft:#163120;
  --code-bg:#0b0f14; --code-fg:#d9dfe8; --code-dim:#556071; --code-kw:#e9a46a; --code-ty:#7fc6cb;
  --code-str:#b0d38c; --code-com:#7d8b9d; --code-num:#d7b3f0;
  --code-hl:rgba(240,179,58,.15); --code-exec:rgba(240,179,58,.32);
  --bad-ink:#b23a2e; --ok-ink:#21703f; --acc-ink:#0a6a70; --mut-ink:#566170;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.page{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,2.6vw,34px);padding-block:18px 56px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:22px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.015em}
.brand b{color:var(--accent);font-weight:800}
.top .sub{color:var(--muted);font-size:13.5px}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:28px;align-items:start}
.stations{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 28px);overflow-y:auto;overscroll-behavior:contain}
.stations h2,.eyebrow,.key .lab,.mm-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.sthd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding-left:9px}
.navtoggle{display:grid;place-items:center;width:28px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font:700 14px/1 var(--f-mono);cursor:pointer}
.navtoggle:hover{color:var(--ink);border-color:var(--line-strong)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Összecsukott menü: csak az állomások száma látszik, a név az egér alatt */
.nav-min .stations h2,.nav-min .stations .foot,.nav-min .stations .sec,.nav-min .st .t{display:none}
.nav-min .st{grid-template-columns:1fr;justify-items:center;padding:6px 4px;min-width:32px}
.nav-min .st .n{text-align:center}
.stations ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.st{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:baseline;width:100%;padding:6px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13.5px;text-align:left;cursor:pointer}
.st:hover{background:var(--panel-2)}
.st .n{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted)}
.st.on{background:var(--ink);color:var(--bg);font-weight:600}
.st.on .n{color:var(--bg)}
.st:disabled{cursor:default;color:var(--muted);opacity:.55;background:none}
.st.sep{margin-top:8px}
.stations .foot{margin:12px 9px 0;font-size:12px;color:var(--muted);line-height:1.4}
.stations .sec{margin:12px 9px 3px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stations .sec:first-child{margin-top:0}
/* Az aktív állomás kinyitott menüje: a sávjai (ha több van) és az aktív sáv lépései. Csak az aktív állomás van nyitva. */
.stations ol.stepnav{display:grid;gap:1px;margin:2px 0 6px 18px;padding-left:8px;border-left:2px solid var(--line)}
.stp,.trk{display:grid;grid-template-columns:22px 1fr;gap:5px;align-items:baseline;width:100%;padding:4px 7px;border:0;border-radius:5px;background:none;color:var(--muted);font-size:12.5px;line-height:1.3;text-align:left;cursor:pointer}
.stp:hover,.trk:hover{background:var(--panel-2);color:var(--ink)}
.stp .n{font-family:var(--f-mono);font-size:11px;text-align:right}
.stp.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.trk{grid-template-columns:1fr;font-weight:600;color:var(--ink)}
.trk.on{color:var(--accent)}
.nav-min .stepnav{display:none}

.modmap{display:grid;gap:8px;margin-bottom:20px}
.mm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px solid transparent;border-radius:14px;padding:4px}
.mm.on{border-color:var(--hl);background:var(--hl-soft)}
.mm-agg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:12px;padding:7px 9px}
.mm-agg.on{border-color:var(--hl);border-style:solid;background:var(--hl-soft)}
.mm-cap{font:600 12px var(--f-mono);color:var(--muted);margin-right:2px}
.mm-cap i{font-style:normal;opacity:.6;margin-left:5px}
.mm-agg.on .mm-cap{color:var(--ink);font-weight:700}
.mchip{font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mchip i{font-style:normal;opacity:.6;margin-left:5px}
.mchip.on{background:var(--hl-soft);border-color:var(--hl);color:var(--ink);font-weight:700}

.sthead{display:grid;gap:4px;margin-bottom:16px}
.sthead h1{font-size:clamp(28px,3.3vw,40px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.sthead .goal{font-family:var(--f-read);font-size:18px;color:var(--muted);margin:4px 0 0;max-width:62ch}

.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;text-align:left}
.tab small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}

.stephead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:16px 0 12px}
.stephead .ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stephead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{position:relative;width:18px;height:18px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:16px;height:5px;border-radius:3px;background:var(--line)}
.dot.seen::before{background:var(--line-strong)}
.dot.on::before{background:var(--hl);height:7px}
.dot.side::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(8px)}

.work{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:start}
.diagram{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;min-width:0}
.diagram .scroll{overflow-x:auto}
#stage{display:block;width:100%;min-width:540px;height:auto;font-family:var(--f-mono);font-variant-ligatures:none}
#stage text{white-space:pre}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin-top:6px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent)}
.sw.bad{border-top:2px dashed var(--bad)}
.sw.ref{border-top:2px dotted var(--muted)}
.sw.hl{border-top:3px solid var(--hl)}
.replay{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px}
.replay:hover{color:var(--ink)}

/* A kód doboza teljes magasságú, görgetősáv nélkül. Ha szélesebb az oszlopánál, jobbra kilóg, legfeljebb
   az ablak széléig; ha ott sem fér el, a layoutCode() a rajz alá teszi, keskeny képernyőn a sor törik. */
.code{background:var(--code-bg);border-radius:10px;overflow:hidden;width:max-content;min-width:100%;justify-self:start;display:flex;flex-direction:column}
/* a fejléc és a fájlcímkék nem szélesítik a dobozt (width:0 + min-width:100%), inkább törnek */
.code-head{display:flex;flex-wrap:wrap;width:0;min-width:100%;justify-content:space-between;gap:4px 10px;padding:9px 14px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--code-dim);border-bottom:1px solid rgba(255,255,255,.06)}
.code-head .cfile{text-transform:none;letter-spacing:0;color:var(--code-fg);font-weight:500;margin-right:8px;overflow-wrap:anywhere}
#code{position:relative;margin:0;padding:8px 0 12px;overflow:visible;font:12.5px/1.62 var(--f-mono);color:var(--code-fg);font-variant-ligatures:none}
.code.wrap .cl{white-space:break-spaces;width:auto;min-width:0;grid-template-columns:40px minmax(0,1fr)}
.code.wrap .cl .tx{overflow-wrap:anywhere}
.work.stack{grid-template-columns:minmax(0,1fr)}
.work.stack > .diagram{position:static;max-width:820px}
.cl{display:grid;grid-template-columns:40px auto;width:max-content;min-width:100%;padding-right:16px;white-space:pre;cursor:default;transition:background .25s}
.cl .no{color:var(--code-dim);text-align:right;padding-right:14px;user-select:none}
.cl.hl{background:var(--code-hl)}
.cl.hv,.cl.exec{background:var(--code-exec)}
.cl.exec .no{color:var(--hl)}
.cl.exec{box-shadow:inset 3px 0 0 var(--hl)}
.k{color:var(--code-kw)} .y{color:var(--code-ty)} .s{color:var(--code-str)} .c{color:var(--code-com);font-style:italic} .n,.d{color:var(--code-num)}
.cf{width:0;min-width:100%;padding:10px 16px 4px 54px;font:500 11.5px var(--f-mono);color:var(--code-dim);white-space:normal;overflow-wrap:anywhere}
.cf:not(:first-child){margin-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.cf b{color:var(--code-fg);font-weight:500;margin-right:8px}

.below{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;margin-top:20px;align-items:start}
.why{font-family:var(--f-read);font-size:17.5px;line-height:1.62;max-width:68ch}
.why p{margin:0 0 .75em}
.why code{font-family:var(--f-mono);font-size:.8em;background:var(--panel-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.why b{font-weight:600}
.key{margin-top:14px;padding-top:10px;border-top:2px solid var(--ink)}
.key p{margin:6px 0 0;font-family:var(--f-display);font-size:16px;line-height:1.5;font-weight:500}
.links{display:grid;gap:8px;justify-items:start}
.side-link,.next-link{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left;font-size:14px;max-width:300px}
.next-link{border-color:var(--ink);background:var(--panel)}
.side-link .lab,.next-link .lab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.next-link .lab{color:var(--muted)}
.see-link{border:1px dashed var(--line-strong);background:none;border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13.5px;max-width:300px}
.see-link b{font-weight:700}
.back-link{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;max-width:300px}
.hint{font-size:12.5px;color:var(--muted);max-width:300px;margin:4px 0 0}

/* SVG */
.node{transition:transform .7s cubic-bezier(.2,.75,.2,1),opacity .45s ease}
.node .shape{fill:var(--panel);stroke:var(--line-strong);stroke-width:1.3}
.node .ttl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.node .sub{font-size:10.5px;fill:var(--muted);font-style:italic}
.node .sep{stroke:var(--line)}
.node .ln{font-size:12px;fill:var(--ink)}
.node .lt-bad{fill:var(--bad)} .node .lt-ok{fill:var(--ok)} .node .lt-muted{fill:var(--muted)} .node .lt-new{fill:var(--accent)}
.node .lbl{font-size:12.5px;fill:var(--ink)}
.k-state .lbl{font-weight:600}
.k-actor .shape{fill:var(--bg);stroke-dasharray:4 3}
.k-actor .lbl{font-style:italic;fill:var(--muted);font-size:12px}
.k-note .shape{fill:transparent;stroke:none}
.k-note .lbl{font-size:11.5px;fill:var(--muted)}
.k-note.t-bad .shape{fill:var(--bad-soft)} .k-note.t-bad .lbl{fill:var(--bad)}
.k-note.t-ok .shape{fill:var(--ok-soft)} .k-note.t-ok .lbl{fill:var(--ok)}
.k-note.t-accent .shape{fill:var(--accent-soft)} .k-note.t-accent .lbl{fill:var(--accent)}
.k-group .shape{fill:color-mix(in srgb,var(--panel-2) 40%,transparent);stroke:var(--line-strong);stroke-width:1.4;stroke-dasharray:6 4}
.k-group .glbl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.04em}
.k-group.t-accent .shape{stroke:var(--accent);fill:color-mix(in srgb,var(--accent-soft) 55%,transparent)} .k-group.t-accent .glbl{fill:var(--accent)}
.k-group.t-current .shape{stroke:var(--hl);fill:color-mix(in srgb,var(--hl-soft) 55%,transparent)} .k-group.t-current .glbl{fill:var(--ink)}
.k-group.t-bad .shape{stroke:var(--bad);fill:color-mix(in srgb,var(--bad-soft) 45%,transparent)} .k-group.t-bad .glbl{fill:var(--bad)}
.k-group.t-ok .shape{stroke:var(--ok);fill:color-mix(in srgb,var(--ok-soft) 45%,transparent)} .k-group.t-ok .glbl{fill:var(--ok)}
.k-group.t-muted .shape{stroke:var(--line)}
.t-current:not(.k-group) .shape{fill:var(--ink);stroke:var(--ink)}
.t-current:not(.k-group) .lbl,.t-current:not(.k-group) .ttl,.t-current:not(.k-group) .ln,.t-current:not(.k-group) .sub{fill:var(--bg)}
.t-new:not(.k-group):not(.k-note) .shape{fill:var(--accent-soft);stroke:var(--accent)}
.t-bad:not(.k-note):not(.k-group) .shape{stroke:var(--bad)}
.t-bad:not(.k-note):not(.k-group) .ttl{fill:var(--bad)}
.t-ok:not(.k-note):not(.k-group) .shape{stroke:var(--ok)}
.t-muted:not(.k-group) .shape{stroke:var(--line)}
.t-muted:not(.k-group) text{fill:var(--muted)}
.chip{fill:var(--panel-2)} .chipt{font-size:10.5px;fill:var(--muted)}
.chip.ct-bad{fill:var(--bad-soft)} .chipt.ct-bad{fill:var(--bad)}
.chip.ct-ok{fill:var(--ok-soft)} .chipt.ct-ok{fill:var(--ok)}
.t-current .chip{fill:var(--line-strong)} .t-current .chipt{fill:var(--bg)}
.t-current:not(.k-group) .ln.lt-bad{fill:var(--bad-ink)} .t-current:not(.k-group) .ln.lt-ok{fill:var(--ok-ink)}
.t-current:not(.k-group) .ln.lt-new{fill:var(--acc-ink)} .t-current:not(.k-group) .ln.lt-muted{fill:var(--mut-ink)}
.t-current .chip.ct-bad{fill:var(--bad-soft)} .t-current .chipt.ct-bad{fill:var(--bad)}
.t-current .chip.ct-ok{fill:var(--ok-soft)} .t-current .chipt.ct-ok{fill:var(--ok)}
.axis{stroke:var(--line-strong);stroke-width:1.5;fill:none}
.tick{stroke:var(--line-strong);stroke-width:1.5}
.tick.strong{stroke:var(--hl);stroke-width:3}
.tl{font-size:11px;fill:var(--muted)} .tl.strong{fill:var(--ink);font-weight:700}
.node.hl .shape,.node.hv .shape{stroke:var(--hl);stroke-width:2.6}
.k-note.hl .shape,.k-note.hv .shape{stroke:var(--hl);stroke-width:1.6}
.k-group.hl .shape,.k-group.hv .shape{stroke-dasharray:none}
.node.hl:not(.k-group),.node.hv:not(.k-group){filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hl) 45%,transparent))}
.node.ping .shape{animation:ping .7s ease}
@keyframes ping{0%{stroke:var(--hl);stroke-width:5}100%{}}

.edge{animation:fadeIn .45s ease both}
.edge.gone{animation:none;opacity:0;transition:opacity .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ep{fill:none;stroke-width:1.6}
.e-ok .ep{stroke:var(--accent);marker-end:url(#mk-ok)}
.e-muted .ep{stroke:var(--line-strong);marker-end:url(#mk-muted)}
.e-bad .ep{stroke:var(--bad);stroke-dasharray:6 4;marker-end:url(#mk-bad)}
.e-ref .ep{stroke:var(--muted);stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:2;marker-end:url(#mk-ref)}
.e-inherit .ep{stroke:var(--line-strong);marker-end:url(#mk-inh)}
.edge.hl .ep,.edge.hv .ep{stroke:var(--hl);stroke-width:2.6;marker-end:url(#mk-hl)}
.elbl,.mlbl{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.e-bad .elbl{fill:var(--bad)}
.e-ref .elbl{fill:var(--muted)}
.msg .mp{fill:none;stroke-width:2.3}
.m-ok .mp,.m-ret .mp{stroke:var(--accent)} .m-bad .mp{stroke:var(--bad)}
.msg.done.m-ok .mp,.msg.done.m-ret .mp{marker-end:url(#mk-ok)}
.msg.done.m-bad .mp{marker-end:url(#mk-bad)}
.msg.done.m-ret .mp{stroke-dasharray:5 4}
.mdot{fill:var(--hl);stroke:var(--panel);stroke-width:2;opacity:0}

<script>
/* Tanulóutak: közös geometria és a közös elemkészlet.
   A felület (shell.html) és az ellenőrző (tools/check.mjs) ugyanezt a fájlt tölti be,
   így a méretszámítás egy helyen él. Az utak saját nyilvántartása a src/courses/<út>/course.json. */
(function (root) {
  "use strict";

  /* Karakterszélesség (px) a JetBrains Mono betűhöz, az adott betűmérettel. */
  const CH = { state: 7.8, actor: 7.2, note: 6.9, line: 7.2, title: 7.8, sub: 6.3, chip: 6.6, label: 6.6, mlabel: 7.0 };
  const VIEW = { w: 640, h: 420 };

  const lt = l => (typeof l === "string" ? { t: l } : l);

  function size(n) {
    switch (n.kind) {
      case "state": return { w: n.w || Math.round(n.label.length * CH.state + 30), h: 32 };
      case "actor": return { w: n.w || Math.round(n.label.length * CH.actor + 28), h: 30 };
      case "note": {
        const ls = n.text.split("\n");
        return { w: n.w || Math.round(Math.max(...ls.map(s => s.length)) * CH.note + 18), h: ls.length * 16 + 10 };
      }
      case "timeline": return { w: n.w, h: 46 };
      case "group": return { w: n.w, h: n.h };
      default: {
        const lines = (n.lines || []).map(lt);
        const h = n.h || ((n.sub ? 44 : 30) + (lines.length ? lines.length * 19 + 10 : 4));
        const w = n.w || Math.round(Math.max(n.title.length * CH.title,
          ...lines.map(l => l.t.length * CH.line + (l.chip ? l.chip.length * CH.chip + 24 : 0))) + 24);
        return { w, h };
      }
    }
  }

  /* Egy doboz i-edik sorának függőleges közepe a doboz középpontjához képest. */
  function lineCenterY(n, i) {
    const { h } = size(n);
    return -h / 2 + (n.sub ? 44 : 30) + 19 + i * 19 - 4;
  }

  function rect(n) {
    const { w, h } = size(n);
    return { x1: n.x - w / 2, y1: n.y - h / 2, x2: n.x + w / 2, y2: n.y + h / 2 };
  }

  function anchor(n, toward, lineIdx) {
    const { w, h } = size(n);
    if (lineIdx != null && n.kind === "box") {
      const right = toward.x >= n.x;
      return { x: n.x + (right ? w / 2 + 3 : -w / 2 - 3), y: n.y + lineCenterY(n, lineIdx) };
    }
    let dx = toward.x - n.x, dy = toward.y - n.y;
    if (!dx && !dy) dy = 1;
    const sx = dx ? (w / 2) / Math.abs(dx) : Infinity, sy = dy ? (h / 2) / Math.abs(dy) : Infinity;
    const s = Math.min(sx, sy), len = Math.hypot(dx, dy);
    const k = s + 4 / len;
    return { x: n.x + dx * k, y: n.y + dy * k };
  }

  /* Hurok: él ugyanabból a csomópontból önmagába, a megadott sarkon (tr, tl, br, bl). */
  function loopGeom(n, corner) {
    const { w, h } = size(n);
    const sx = /l/.test(corner || "") ? -1 : 1, sy = /b/.test(corner || "") ? 1 : -1;
    const p1 = { x: n.x + sx * (w / 2 - 16), y: n.y + sy * (h / 2 + 3) };
    const p2 = { x: n.x + sx * (w / 2 + 3), y: n.y + sy * (h / 2 - 12) };
    const c = { x: n.x + sx * (w / 2 + 36), y: n.y + sy * (h / 2 + 36) };
    const f = v => Math.round(v * 10) / 10;
    return {
      d: `M${f(p1.x)},${f(p1.y)} Q${f(c.x)},${f(c.y)} ${f(p2.x)},${f(p2.y)}`,
      lx: .25 * p1.x + .5 * c.x + .25 * p2.x + sx * 6, ly: .25 * p1.y + .5 * c.y + .25 * p2.y + sy * 8, p1, c, p2
    };
  }

  /* Él vagy üzenet útvonala két csomópont között; a görbület a merőleges eltolás aránya. */
  function geom(a, b, curve, fromLine, toLine, loop) {
    if (a === b) return loopGeom(a, loop);
    const a0 = (fromLine != null && a.kind === "box") ? { x: a.x, y: a.y + lineCenterY(a, fromLine) } : { x: a.x, y: a.y };
    const b0 = (toLine != null && b.kind === "box") ? { x: b.x, y: b.y + lineCenterY(b, toLine) } : { x: b.x, y: b.y };
    const dx = b0.x - a0.x, dy = b0.y - a0.y;
    const c = curve ? { x: (a0.x + b0.x) / 2 - dy * curve, y: (a0.y + b0.y) / 2 + dx * curve } : null;
    const p1 = anchor(a, c || b0, fromLine), p2 = anchor(b, c || a0, toLine);
    const f = v => Math.round(v * 10) / 10;
    if (c) {
      return {
        d: `M${f(p1.x)},${f(p1.y)} Q${f(c.x)},${f(c.y)} ${f(p2.x)},${f(p2.y)}`,
        lx: .25 * p1.x + .5 * c.x + .25 * p2.x, ly: .25 * p1.y + .5 * c.y + .25 * p2.y, p1, c, p2
      };
    }
    return { d: `M${f(p1.x)},${f(p1.y)} L${f(p2.x)},${f(p2.y)}`, lx: (p1.x + p2.x) / 2, ly: (p1.y + p2.y) / 2, p1, c: null, p2 };
  }

  /* A motor elemkészlete; minden úton ugyanez. */
  const REGISTRY = {
    kinds: ["box", "state", "actor", "note", "timeline", "group"],
    tones: ["current", "new", "bad", "ok", "muted", "accent"],
    edgeKinds: ["ok", "muted", "bad", "ref", "inherit"],
    msgKinds: ["ok", "bad", "ret"],
    langs: ["cs", "ts", "tsx", "js", "py", "sql", "json", "yaml", "html", "razor", "bash", "http", "md", "text"],
    loops: ["tr", "tl", "br", "bl"]
  };

  const h = {
    bad: t => ({ t, tone: "bad" }),
    ok: t => ({ t, tone: "ok" }),
    mut: t => ({ t, tone: "muted" }),
    neu: t => ({ t, tone: "new" })
  };

  root.OOPGeom = { CH, VIEW, lt, size, lineCenterY, rect, anchor, geom, REGISTRY };
  root.OOP = root.OOP || {
    stations: {}, courseDef: null,
    station(def) { this.stations[def.id] = def; },
    course(def) { this.courseDef = def; }
  };
  root.OOP.h = h;
  /* Kódblokk szó szerint: raw`...` megtartja a visszaperjeleket (\n, \d), csak a \` és a \${ jelölést
     alakítja vissza backtickké és ${-vé, a <\/ jelölést pedig </-vé (így a záró script-címke is leírható).
     Így TS-, Python- és HTML-kód is beírható úgy, ahogy van. */
  root.OOP.raw = (strings, ...vals) => {
    if (vals.length) throw new Error("raw`...`: a kódblokkban nem lehet ${...} behelyettesítés; írd így: \\${");
    return strings.raw[0].replace(/\\`/g, "`").replace(/\\\$\{/g, "${").replace(/<\\\//g, "</");
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Tanulóutak: kódszínezés több nyelvre.
   A felület és a tools/ alatti próbák is ezt töltik be. Soronként színez, de a több soron átnyúló
   elemeket (blokk-komment, többsoros sztring, sablon-sztring) a sorok között is viszi.
   Osztályok: k kulcsszó, y típus vagy címke, s sztring, c komment, n szám, d dekorátor. */
(function (root) {
  "use strict";
  const words = s => new Set(s.trim().split(/\s+/));

  const CS_KW = "public private protected internal sealed abstract class record struct interface enum void return new throw if else switch case break continue default var static readonly override virtual get set init using bool string decimal int long double float byte char is or and not null true false this base nameof out ref in async await yield foreach for while do try catch finally where when with const params partial delegate event operator implicit explicit typeof object namespace required lock goto checked unchecked dynamic";
  const TS_KW = "const let var function return if else for while do switch case break continue new class extends implements interface type enum import export from as default async await yield try catch finally throw typeof instanceof in of keyof readonly public private protected static abstract declare namespace void null undefined true false this super satisfies infer never unknown any string number boolean bigint symbol object get set is asserts override accessor";
  const PY_KW = "def class return if elif else for while in not and or is None True False import from as with async await yield lambda try except finally raise pass break continue global nonlocal del assert match case self cls";
  const SQL_KW = "select from where insert into values update set delete create table index on primary key foreign references not null unique and or in is join left right inner outer group by order having limit offset as begin commit rollback transaction for skip locked nowait returning with distinct count sum min max default check constraint union all exists case when then else end isolation level serializable read committed repeatable varchar int integer bigint text timestamp timestamptz boolean decimal numeric uuid serial bigserial jsonb alter add drop if partition range hash replica conflict do nothing now interval asc desc true false";
  const BASH_KW = "if then else elif fi for in do done while until case esac function return export local readonly set unset source exit";

  const SPEC = {
    cs: { kw: words(CS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [['"""', '"""', false]], quotes: ['"', "'"], prefix: /[$@]{1,3}(?=")/y },
    ts: { kw: words(TS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [["`", "`", true]], quotes: ['"', "'"], deco: true, dollar: true },
    js: { kw: words(TS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [["`", "`", true]], quotes: ['"', "'"], deco: true, dollar: true },
    py: { kw: words(PY_KW), ty: words("str int float bool list dict set tuple bytes object type"), cap: true, line: ["#"], block: [],
          multi: [['"""', '"""', true], ["'''", "'''", true]], quotes: ['"', "'"], prefix: /(?:rb|br|fr|rf|[rbfu])(?=["'])/iy, deco: true },
    sql: { kw: words(SQL_KW), nocase: true, line: ["--"], block: [["/*", "*/"]], multi: [], quotes: ["'"] },
    json: { kw: words("true false null"), line: [], block: [], multi: [], quotes: ['"'], keys: true },
    yaml: { kw: words("true false null yes no on off"), line: ["#"], block: [], multi: [], quotes: ['"', "'"], yamlKeys: true },
    html: { kw: new Set(), line: [], block: [["<!--", "-->"]], multi: [], quotes: ['"', "'"], tags: "always" },
    razor: { kw: words(CS_KW), cap: true, line: [], block: [["@*", "*@"], ["<!--", "-->"]], multi: [], quotes: ['"', "'"], tags: "always", razor: true },
    bash: { kw: words(BASH_KW), line: ["#"], block: [], multi: [], quotes: ['"', "'"], vars: true },
    http: { kw: words("GET POST PUT PATCH DELETE HEAD OPTIONS HTTP true false null"), line: [], block: [], multi: [], quotes: ['"'], yamlKeys: true, keys: true },
    text: { kw: new Set(), line: [], block: [], multi: [], quotes: [] }
  };
  SPEC.tsx = Object.assign({}, SPEC.ts, { tags: "jsx" });

  const LABELS = { cs: "C#", ts: "TypeScript", tsx: "TSX", js: "JavaScript", py: "Python", sql: "SQL", json: "JSON",
    yaml: "YAML", html: "HTML", razor: "Razor", bash: "Shell", http: "HTTP", md: "Markdown", text: "Szöveg" };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /* A záró jel helye a from indextől; a visszaperrel védett jelet átugorja. Visszaad: a záró jel utáni index, vagy -1. */
  function findEnd(line, from, end, escapes) {
    for (let i = from; i <= line.length - end.length; i++) {
      if (escapes && line[i] === "\\") { i++; continue; }
      if (line.startsWith(end, i)) return i + end.length;
    }
    return -1;
  }

  const ID = /[A-Za-z_][A-Za-z0-9_]*/y, ID_DOLLAR = /[A-Za-z_$][A-Za-z0-9_$]*/y;
  const NUM = /0[xX][0-9a-fA-F_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?[A-Za-z]?/y;
  const at = (re, s, i) => { re.lastIndex = i; const m = re.exec(s); return m ? m[0] : null; };

  /* Markdown: címsor, felsorolásjel, félkövér, kódrészlet, link címe, HTML-komment, kódkerítés és YAML-fejléc.
     A kerítésen belüli sorokat nem színezi (azok bármilyen nyelvűek lehetnek). */
  function highlightMd(lines) {
    let fence = false, front = false;
    return lines.map((line, n) => {
      if (n === 0 && /^---\s*$/.test(line)) { front = true; return `<span class="c">${esc(line)}</span>`; }
      if (front) {
        if (/^---\s*$/.test(line)) { front = false; return `<span class="c">${esc(line)}</span>`; }
        return highlight([line], "yaml")[0];
      }
      if (/^\s*(```|~~~)/.test(line)) { fence = !fence; return `<span class="c">${esc(line)}</span>`; }
      if (fence) return esc(line);
      if (/^\s*<!--.*-->\s*$/.test(line)) return `<span class="c">${esc(line)}</span>`;
      if (/^#{1,6}\s/.test(line)) return `<span class="k">${esc(line)}</span>`;
      let html = "", i = 0;
      const b = /^(\s*)([-*+]|\d+\.)(\s+)/.exec(line);
      if (b) { html += esc(b[1]) + `<span class="y">${esc(b[2])}</span>` + b[3]; i = b[0].length; }
      const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)]+\))|(<!--.*?-->)/g;
      re.lastIndex = i;
      let m;
      while ((m = re.exec(line))) {
        html += esc(line.slice(i, m.index));
        if (m[1]) html += `<span class="s">${esc(m[1])}</span>`;
        else if (m[2]) html += `<span class="k">${esc(m[2])}</span>`;
        else if (m[3]) { const k = m[3].indexOf("]("); html += esc(m[3].slice(0, k + 1)) + `<span class="c">${esc(m[3].slice(k + 1))}</span>`; }
        else html += `<span class="c">${esc(m[4])}</span>`;
        i = m.index + m[0].length;
      }
      return html + esc(line.slice(i));
    });
  }

  function highlight(lines, lang) {
    if (lang === "md") return highlightMd(lines);
    const L = SPEC[lang] || SPEC.text;
    let carry = null;
    return lines.map(line => {
      let i = 0, html = "", prev = "", lastKw = false;
      const push = (cls, s) => { if (!s) return; html += cls ? `<span class="${cls}">${esc(s)}</span>` : esc(s); if (/\S/.test(s)) { prev = s.trim().slice(-1); lastKw = false; } };
      if (carry) {
        const j = findEnd(line, 0, carry.end, carry.esc);
        if (j < 0) { push(carry.cls, line); return html; }
        push(carry.cls, line.slice(0, j)); i = j; carry = null;
      }
      if (L.yamlKeys) {
        const m = /^(\s*(?:-\s+)?)([\w.\/-]+)(\s*:)(?=\s|$)/.exec(line);
        if (m) { push("", m[1]); push("y", m[2]); push("", m[3]); i = m[0].length; }
      }
      scan: while (i < line.length) {
        const ch = line[i];
        if (ch === " " || ch === "\t") { const j = line.slice(i).search(/\S/); const n = j < 0 ? line.length - i : j; html += line.slice(i, i + n); i += n; continue; }
        for (const [open, close] of L.block) {
          if (line.startsWith(open, i)) {
            const j = findEnd(line, i + open.length, close, false);
            if (j < 0) { push("c", line.slice(i)); carry = { end: close, cls: "c", esc: false }; return html; }
            push("c", line.slice(i, j)); i = j; continue scan;
          }
        }
        for (const lc of L.line) {
          if (line.startsWith(lc, i) && !(lc === "#" && L.vars && line[i - 1] === "$")) { push("c", line.slice(i)); return html; }
        }
        let pre = "";
        if (L.prefix) { const p = at(L.prefix, line, i); if (p) pre = p; }
        const q0 = i + pre.length;
        for (const [open, close, escapes] of L.multi) {
          if (line.startsWith(open, q0)) {
            const j = findEnd(line, q0 + open.length, close, escapes);
            if (j < 0) { push("s", line.slice(i)); carry = { end: close, cls: "s", esc: escapes }; return html; }
            push("s", line.slice(i, j)); i = j; continue scan;
          }
        }
        if (L.quotes.includes(line[q0])) {
          const q = line[q0];
          let j = findEnd(line, q0 + 1, q, true);

        var reply = await writer.DraftAsync(booking!, verdict, ct);

public async Task<ReplyDecision> PrepareReplyAsync(InboundEmail email, RefundVerdict verdict,
    CancellationToken ct)
{
    // szekcionálás: független részfeladatok egyszerre
    var draftTask = writer.DraftAsync(email, verdict, ct);                        // nagy modell
    var safetyTask = model.AskAsync<SafetyCheck>(SafetyPrompt, email.Body, ModelSize.Small, ct);

    // szavazás: ugyanaz a kérdés háromszor, a többség dönt
    var votes = Enumerable.Range(0, 3)
        .Select(_ => model.AskAsync<LegalThreat>(LegalPrompt, email.Body, ModelSize.Small, ct));
    var legalTask = Task.WhenAll(votes);

    await Task.WhenAll(draftTask, safetyTask, legalTask);

    var legalThreat = legalTask.Result.Count(v => v.IsThreat) >= 2;
    if (safetyTask.Result.ContainsInjection || legalThreat)
        return ReplyDecision.ToHuman(legalThreat ? "jogi fenyegetés" : "gyanús tartalom");

    return ReplyDecision.Send(draftTask.Result);
}

public sealed record SafetyCheck(bool ContainsInjection, string? Evidence);
public sealed record LegalThreat(bool IsThreat, string Reason);`,

public sealed record Evaluation(bool Passes, IReadOnlyList<string> Problems);

public async Task<ReplyDecision> WriteWithReviewAsync(RefundFacts facts, CancellationToken ct)
{
    var draft = await writer.DraftAsync(facts, feedback: null, ct);

    for (var round = 1; round <= 3; round++)
    {
        var review = await model.AskAsync<Evaluation>(
            """
            Ellenőrizd a válaszlevelet. Szempontok:
            1. Szerepel benne a visszatérített összeg és a foglalásszám, a tények szerint.
            2. Nem ígér a tényekben nem szereplő határidőt vagy kártérítést.
            3. Udvarias, rövid, magyar nyelvű.
            Sorold fel a megsértett szempontokat.
            """,
            $"TÉNYEK:\n{facts.ToPromptText()}\n\nLEVÉL:\n{draft}", ModelSize.Small, ct);

        if (review.Passes)
            return ReplyDecision.Send(draft);

        draft = await writer.DraftAsync(facts, feedback: review.Problems, ct);
    }
    return ReplyDecision.ToHuman("három kör után sem felelt meg");
}`,

public sealed class TicketChangeAgent(HarnessFactory harnesses, ToolRegistryFactory tools)

    {
        var harness = harnesses.Create(tools.Only(ToolNames), new RunLimits { MaxTurns = 10 });
        var ctx = new ToolContext(Guid.NewGuid(), email.CustomerId, Channel: "email");

        var outcome = await harness.RunAsync(
            "Az ügyfél jegycserét kér. Derítsd ki, lehetséges-e, és mennyibe kerül. " +
            "Ne cserélj magadtól: a végén foglald le a helyeket, és kérj megerősítést.\n\n" +
            email.Body, ctx, ct);

        return outcome switch
        {
            RunOutcome.Answered a => WorkflowResult.AwaitingCustomer(a.Text),
            _ => WorkflowResult.ToHuman("a jegycsere nem zárult le")
        };
    }
}`,

public sealed record PolicyChunk(
    string DocumentId, int Index, string HeadingPath, string Content, int Tokens);

public sealed class HeadingChunker(ITokenCounter tokens)
{
    private const int MaxTokens = 400;

    public IEnumerable<PolicyChunk> Split(PolicyDocument doc)
    {
        var index = 0;
        // először a címsorok mentén vágunk: egy szakasz általában egy gondolat
        foreach (var section in doc.Sections)
        {
            // pl. "Visszatérítés > Elhalasztott koncert"
            var heading = string.Join(" > ", section.HeadingPath);
            foreach (var part in SplitByParagraphs(section.Text))
                yield return new PolicyChunk(doc.Id, index++, heading, part, tokens.Count(part));
        }
    }

    // a túl hosszú szakaszt bekezdéshatáron vágjuk tovább, egy bekezdés átfedéssel
    private IEnumerable<string> SplitByParagraphs(string text)
    {
        var current = new List<string>();
        foreach (var paragraph in text.Split("\n\n"))
        {
            var candidate = string.Join("\n\n", current.Append(paragraph));
            if (current.Count > 0 && tokens.Count(candidate) > MaxTokens)
            {
                yield return string.Join("\n\n", current);
                current = [current[^1]];          // átfedés: az utolsó bekezdés átkerül
            }
            current.Add(paragraph);
        }
        if (current.Count > 0) yield return string.Join("\n\n", current);
    }
}`,

public static class Similarity
{
    // koszinusz-hasonlóság: 1 = azonos irány, 0 = független, -1 = ellentétes
    public static double Cosine(ReadOnlySpan<float> a, ReadOnlySpan<float> b)
    {
        double dot = 0, na = 0, nb = 0;
        for (var i = 0; i < a.Length; i++)
        {
            dot += a[i] * b[i];
            na += a[i] * a[i];
            nb += b[i] * b[i];
        }
        return dot / (Math.Sqrt(na) * Math.Sqrt(nb));
    }
}

public sealed record PolicyHit(long Id, string HeadingPath, string Content, double Distance);

public async Task<IReadOnlyList<PolicyHit>> SearchAsync(
    string question, int k, CancellationToken ct)
{
    var q = (await embeddings.EmbedAsync([question], EmbedPurpose.Query, ct))[0];

    await using var cmd = db.CreateCommand("""
        SELECT id, heading_path, content, embedding <=> @q AS distance
        FROM policy_chunks
        ORDER BY embedding <=> @q
        LIMIT @k
        """);
    cmd.Parameters.AddWithValue("q", new Vector(q));
    cmd.Parameters.AddWithValue("k", k);

    var hits = new List<PolicyHit>();
    await using var reader = await cmd.ExecuteReaderAsync(ct);
    while (await reader.ReadAsync(ct))
        hits.Add(new PolicyHit(reader.GetInt64(0), reader.GetString(1),
            reader.GetString(2), reader.GetDouble(3)));
    return hits;
}`,

public interface IReranker
{
    // a kérdést és minden jelöltet együtt olvassa (cross-encoder), relevancia 0 és 1 között
    Task<IReadOnlyList<double>> ScoreAsync(string query, IReadOnlyList<string> documents,
        CancellationToken ct);
}

public async Task<IReadOnlyList<PolicyHit>> RetrieveAsync(string question, CancellationToken ct)
{
    // 1. szakasz: olcsó és széles, 20 jelölt a hibrid keresésből
    var candidates = await hybrid.SearchAsync(question, k: 20, ct);

    // 2. szakasz: drága és pontos, a reranker csak ezt a 20-at olvassa
    var scores = await reranker.ScoreAsync(question,
        [.. candidates.Select(c => c.HeadingPath + "\n" + c.Content)], ct);

    return candidates
        .Zip(scores, (hit, score) => (hit, score))
        .Where(x => x.score >= 0.3)               // ami ennél gyengébb, inkább ne legyen ott
        .OrderByDescending(x => x.score)
        .Take(5)
        .Select(x => x.hit)
        .ToList();
}`,

public sealed record RetrievalCase(string Question, IReadOnlySet<long> RelevantChunkIds);

public static class RetrievalEval
{
    // recall@k: a szükséges darabok mekkora része került be a top-k találatba
    public static double RecallAtK(IReadOnlyList<long> retrieved, IReadOnlySet<long> relevant,
        int k)
    {
        var hit = retrieved.Take(k).Count(relevant.Contains);
        return relevant.Count == 0 ? 1 : (double)hit / relevant.Count;
    }

    public static async Task<double> RunAsync(IReadOnlyList<RetrievalCase> cases,
        Func<string, Task<IReadOnlyList<PolicyHit>>> retrieve, int k)
    {
        var scores = new List<double>();
        foreach (var c in cases)
        {
            var hits = await retrieve(c.Question);
            scores.Add(RecallAtK([.. hits.Select(h => h.Id)], c.RelevantChunkIds, k));
        }
        return scores.Average();
    }
}

public sealed record CodeChunk(string Path, string Symbol, string Kind, int StartLine, string Text);

public static class RoslynChunker
{
    public static IEnumerable<CodeChunk> Split(string path, string source)
    {
        var root = CSharpSyntaxTree.ParseText(source).GetRoot();

        // egy darab egy metódus: a szignatúrával, a dokumentációs kommenttel és a törzzsel
        foreach (var method in root.DescendantNodes().OfType<MethodDeclarationSyntax>())
        {
            var owner = method.Ancestors().OfType<TypeDeclarationSyntax>().First().Identifier.Text;
            var line = method.GetLocation().GetLineSpan().StartLinePosition.Line + 1;
            yield return new CodeChunk(path, owner + "." + method.Identifier.Text, "method", line,
                method.ToFullString());           // a ToFullString a kommentet is hozza
        }

        // az osztály maga egy rövid összefoglaló darab: a metódusainak a listája
        foreach (var type in root.DescendantNodes().OfType<TypeDeclarationSyntax>())
        {
            var members = string.Join("\n", type.Members.OfType<MethodDeclarationSyntax>()
                .Select(m => "  " + m.Identifier.Text + m.ParameterList));
            yield return new CodeChunk(path, type.Identifier.Text, "type",
                type.GetLocation().GetLineSpan().StartLinePosition.Line + 1,
                type.Keyword.Text + " " + type.Identifier.Text + "\n" + members);
        }
    }
}`,

public sealed class IncrementalCodeIndexer(ICodeIndex index, IEmbeddingClient embeddings)
{
    public async Task UpdateAsync(string repoPath, string fromCommit, string toCommit,
        CancellationToken ct)
    {
        // csak a változott .cs fájlok: egy commit általában néhány fájlt érint
        var changed = await Git.DiffNamesAsync(repoPath, fromCommit, toCommit, "*.cs", ct);

        foreach (var file in changed)
        {
            await index.DeleteFileAsync(file.Path, ct);
            if (file.Status == ChangeStatus.Deleted) continue;

            var source = await File.ReadAllTextAsync(Path.Combine(repoPath, file.Path), ct);
            var chunks = RoslynChunker.Split(file.Path, source).ToList();
            var vectors = await embeddings.EmbedAsync(
                [.. chunks.Select(c => c.Symbol + "\n" + c.Text)], EmbedPurpose.Document, ct);
            await index.AddAsync(chunks, vectors, toCommit, ct);
        }
        await index.SetHeadAsync(toCommit, ct);
    }
}`,

public sealed class Harness(IModelClient model, ToolRegistry tools)
{
    public async Task<string> RunAsync(string userText, CancellationToken ct)
    {
        var transcript = new Transcript();
        transcript.AddUser(new TextBlock(userText));

        while (true)
        {
            var reply = await model.SendAsync(transcript, tools.Specs, ct);
            transcript.AddAssistant(reply.Blocks);

            if (reply.StopReason != StopReason.ToolUse)
                return reply.Text;                           // end_turn: kész a válasz

            var results = new List<Block>();
            foreach (var use in reply.ToolUses)
                results.Add(await tools.ExecuteAsync(use, ct));

            transcript.AddUser(results);                     // az eredmény vissza a modellhez
        }
    }
}

        _messages.Add(new(Role.Assistant, blocks));

        _messages.Count > 0 && _messages[^1].Role == Role.Assistant

public sealed record RunLimits
{
    public int MaxTurns { get; init; } = 12;
}

public abstract record RunOutcome
{
    public sealed record Answered(string Text, int Turns) : RunOutcome;
    public sealed record Truncated(string PartialText, int Turns) : RunOutcome;
    public sealed record TurnLimitReached(int Turns) : RunOutcome;
}

public async Task<RunOutcome> RunAsync(string userText, CancellationToken ct)
{
    var transcript = new Transcript();
    transcript.AddUser(new TextBlock(userText));

    for (var turn = 1; turn <= limits.MaxTurns; turn++)
    {
        ct.ThrowIfCancellationRequested();               // az ügyfél bezárta az ablakot
        var reply = await model.SendAsync(transcript, tools.Specs, ct);
        transcript.AddAssistant(reply.Blocks);

        switch (reply.StopReason)
        {
            case StopReason.EndTurn:
                return new RunOutcome.Answered(reply.Text, turn);
            case StopReason.MaxTokens:
                return new RunOutcome.Truncated(reply.Text, turn);

public abstract class Tool<TInput> : ITool where TInput : class
{
    public abstract ToolSpec Spec { get; }

    public async Task<string> InvokeAsync(JsonElement raw, CancellationToken ct)
    {
        TInput? input;
        try
        {
            input = raw.Deserialize<TInput>(JsonDefaults.Options);
        }
        catch (JsonException ex)                // hiányzó kötelező mező, rossz típus
        {
            throw new ToolException($"Hibás bemenet: {ex.Message} Javítsd a séma szerint.");
        }
        if (input is null) throw new ToolException("Üres bemenet.");

        var problems = Validate(input).ToList();
        if (problems.Count > 0)
            throw new ToolException("Hibás bemenet: " + string.Join("; ", problems));

        return await RunAsync(input, ct);
    }

    protected virtual IEnumerable<string> Validate(TInput input) => [];
    protected abstract Task<string> RunAsync(TInput input, CancellationToken ct);
}

{

public sealed class ToolRegistry
{
    private readonly Dictionary<string, ITool> _byName;

    public ToolRegistry(IEnumerable<ITool> tools)
    {
        _byName = tools.ToDictionary(t => t.Spec.Name);     // két azonos név: indításkor kiderül
    }

    public IReadOnlyList<ToolSpec> Specs => _byName.Values.Select(t => t.Spec).ToList();

    public bool IsReadOnly(string name) => _byName.TryGetValue(name, out var t) && t.ReadOnly;

    public async Task<string> InvokeAsync(string name, JsonElement input, CancellationToken ct)
    {
        if (!_byName.TryGetValue(name, out var tool))
            throw new ToolException($"Ismeretlen eszköz: {name}. Csak a felsoroltakat használd.");
        return await tool.InvokeAsync(input, ct);
    }
}

public sealed class SupportPolicy(ToolRegistry tools, IBookingReader bookings) : IPermissionPolicy
{
    private const decimal AutoRefundLimitHuf = 20_000m;

    public async Task<Decision> DecideAsync(ToolUse use, CancellationToken ct)
    {
        if (tools.IsReadOnly(use.Name))
            return new(Verdict.Allow, "csak olvas");

        if (use.Name == "refund_booking")
        {
            var id = use.Input.TryGetProperty("bookingId", out var p) ? p.GetString() : null;
            var booking = id is null ? null : await bookings.FindAsync(id, ct);
            if (booking is null)
                return new(Verdict.Deny, "nincs ilyen foglalás");

            return booking.Total.Amount <= AutoRefundLimitHuf
                ? new(Verdict.Allow, "kis összeg, a szabályzat szerint automatikus")
                : new(Verdict.Ask, $"{booking.Total} visszatérítése: ügyintéző hagyja jóvá");
        }

        return new(Verdict.Deny, $"a(z) {use.Name} eszközre nincs engedélyszabály");
    }

private async Task<ToolResult> GuardedExecuteAsync(ToolUse use, CancellationToken ct)
{
    var decision = await policy.DecideAsync(use, ct);

    if (decision.Verdict == Verdict.Ask)
    {
        var approval = await approvals.RequestAsync(
            new ApprovalRequest(runId, use.Name, use.Input, decision.Reason), ct);
        decision = approval.Granted
            ? new(Verdict.Allow, $"jóváhagyta: {approval.By}")
            : new(Verdict.Deny, $"elutasította: {approval.By}. {approval.Note}");
    }

    log.LogInformation("Engedély {Tool}: {Verdict} ({Reason})",
        use.Name, decision.Verdict, decision.Reason);

    if (decision.Verdict == Verdict.Deny)
        return new ToolResult(use.Id, "Nem engedélyezett: " + decision.Reason, IsError: true);

    return await ExecuteAsync(use, ct);
}`,

private async Task<List<Block>> ExecuteAllAsync(
    IReadOnlyList<ToolUse> uses, ToolContext ctx, CancellationToken ct)
{
    var results = new ToolResult[uses.Count];
    var indexed = uses.Select((use, i) => (use, i)).ToList();

    // ami csak olvas, az mehet egyszerre
    var reads = indexed.Where(x => tools.IsReadOnly(x.use.Name));
    await Task.WhenAll(reads.Select(async x =>
        results[x.i] = await GuardedExecuteAsync(x.use, ctx, ct)));

    // ami változtat, az egyesével, a modell által kért sorrendben
    foreach (var (use, i) in indexed.Where(x => !tools.IsReadOnly(x.use.Name)))
        results[i] = await GuardedExecuteAsync(use, ctx, ct);

    return [.. results];        // a sorrend a kérések sorrendje marad
}`,

public sealed class RunCommandTool(Workspace workspace) : Tool<CommandInput>
{
    public override ToolSpec Spec => CoderTools.RunCommand;

    protected override async Task<string> RunAsync(
        CommandInput input, ToolContext ctx, CancellationToken ct)
    {
        var psi = new ProcessStartInfo("bash")
        {
            ArgumentList = { "-c", input.Command },
            WorkingDirectory = workspace.Root,
            RedirectStandardOutput = true,
            RedirectStandardError = true
        };
        using var process = Process.Start(psi)!;
        var stdout = await process.StandardOutput.ReadToEndAsync(ct);
        var stderr = await process.StandardError.ReadToEndAsync(ct);
        await process.WaitForExitAsync(ct);
        return $"exit {process.ExitCode}\n{stdout}{stderr}";
    }
}`,

    }

public sealed class ContextMeter(int windowTokens, double compactAt = 0.7)
{
    public int Used { get; private set; }

    public void Record(Usage u) => Used = u.InputTokens + u.CacheReadTokens + u.OutputTokens;

    public double Fill => (double)Used / windowTokens;
    public bool NeedsCompaction => Fill >= compactAt;
}

public sealed class TranscriptCompactor(IModelClient model)
{
    private const string SummaryPrompt = """
        Foglald össze az eddigi ügyintézést a folytatáshoz. Tartsd meg pontosan
        a foglalásszámokat, az összegeket, az ügyfél kérését, a megtett lépéseket
        és az eredményüket, valamint azt, ami még hátravan. Ne találj ki semmit.
        """;

    public async Task CompactAsync(Transcript transcript, CancellationToken ct)
    {
        // az utolsó két kör szó szerint marad, és a vágás egy assistant-üzenet elé esik:
        // így tool_use soha nem válik el a saját tool_result-jától
        var cut = transcript.CompactionCut(keepRecentTurns: 2);
        if (cut <= 1) return;

        var request = new Transcript();
        request.AddUser(new TextBlock(SummaryPrompt + "\n\n" + transcript.Render(0, cut)));
        var summary = await model.SendAsync(request, tools: [], ct);

        transcript.ReplacePrefix(cut,
            new TextBlock("Az eddigi ügy összefoglalója:\n" + summary.Text));
    }
}

public void ReplacePrefix(int count, Block summary)       // a Transcript osztályban
{
    if (_messages[count].Role != Role.Assistant)
        throw new InvalidOperationException("A vágás csak assistant-üzenet elé eshet.");

    _messages.RemoveRange(0, count);
    _messages.Insert(0, new Message(Role.User, [summary]));   // a lista user-rel kezdődik
}`,

public sealed class ToolOutputShaper(ITokenCounter tokens, IResultStore store)
{
    private const int MaxTokens = 4_000;

    public string Shape(Guid runId, string toolName, string output)
    {
        if (tokens.Count(output) <= MaxTokens)
            return output;

        // a teljes eredményt eltesszük; a modell az elejét, a méretet és egy hivatkozást kap
        var handle = store.Save(runId, toolName, output);
        var head = tokens.TakeWithin(output, MaxTokens - 300);

        return $"""
            {head}
            [Az eredmény levágva: összesen {tokens.Count(output)} token. Hivatkozás: {handle}.
            Szűkítsd a kérést (például koncert vagy dátum szerint), vagy olvasd tovább
            lapozva: read_result("{handle}", offset).]
            """;
    }
}

// az ExecuteAsync-ben: a modell elé csak a formázott eredmény kerül
var output = await tools.InvokeAsync(use.Name, use.Input, ctx, ct);
return new ToolResult(use.Id, shaper.Shape(ctx.RunId, use.Name, output));`,

public sealed class RunBudget(RunLimits limits, IPriceList prices, TimeProvider clock)
{
    private readonly DateTimeOffset _started = clock.GetUtcNow();
    public int Tokens { get; private set; }
    public decimal CostUsd { get; private set; }

    public void Charge(string modelName, Usage usage)
    {
        Tokens += usage.InputTokens + usage.CacheReadTokens + usage.OutputTokens;
        CostUsd += prices.CostOf(modelName, usage);     // modellenként és tokenfajtánként más ár
    }

    public string? Exceeded() =>
        Tokens > limits.MaxTotalTokens ? "tokenkeret" :
        CostUsd > limits.MaxCostUsd ? "költségkeret" :
        clock.GetUtcNow() - _started > limits.MaxDuration ? "időkeret" : null;
}

public sealed class ResilientModelClient(IModelClient primary, IModelClient fallback,
    TimeProvider clock, ILogger<ResilientModelClient> log) : IModelClient
{
    public async Task<ModelReply> SendAsync(
        Transcript transcript, IReadOnlyList<ToolSpec> tools, CancellationToken ct)
    {
        for (var attempt = 1; ; attempt++)
        {
            try
            {
                using var timeout = CancellationTokenSource.CreateLinkedTokenSource(ct);
                timeout.CancelAfter(TimeSpan.FromSeconds(90));
                return await primary.SendAsync(transcript, tools, timeout.Token);
            }
            catch (ModelApiException ex) when (ex.IsTransient && attempt < 4)
            {
                // 429: a szolgáltató megmondja, mennyit várjunk; különben exponenciálisan
                var wait = ex.RetryAfter ?? Backoff(attempt);
                log.LogWarning("Modellhiba {Status}, újra {Wait} múlva", ex.Status, wait);
                await Task.Delay(wait, clock, ct);
            }
            catch (ModelApiException ex) when (ex.IsTransient)
            {
                log.LogWarning("Az elsődleges modell nem elérhető ({Status}): tartalék", ex.Status);
                return await fallback.SendAsync(transcript, tools, ct);
            }
            catch (OperationCanceledException) when (!ct.IsCancellationRequested && attempt < 4)
            {
                log.LogWarning("Időtúllépés a modellhívásban, {Attempt}. próba", attempt);
            }
        }
    }

    // 2, 4, 8 másodperc, plusz legfeljebb egy másodperc véletlen eltolás (jitter)
    private static TimeSpan Backoff(int attempt) =>
        TimeSpan.FromSeconds(Math.Pow(2, attempt) + Random.Shared.NextDouble());
}

public enum StopReason { EndTurn, ToolUse, MaxTokens, Refusal }

public interface IModelClient
{
    Task<ModelReply> SendAsync(Transcript transcript, IReadOnlyList<ToolSpec> tools,
        CancellationToken ct, int? maxOutputTokens = null);
}

private async Task<ModelReply> SendCheckedAsync(Transcript transcript, CancellationToken ct)
{
    var reply = await model.SendAsync(transcript, tools.Specs, ct);

    // 1. üres válasz: se szöveg, se eszközhívás. Egyszer újrakérjük ugyanazzal a transcripttel.
    if (reply.StopReason == StopReason.EndTurn && !reply.Blocks.Any())
        reply = await model.SendAsync(transcript, tools.Specs, ct);

    // 2. csonka eszközhívás: a hosszkorlát a tool_use bemenetének közepén vágott
    if (reply.StopReason == StopReason.MaxTokens && reply.ToolUses.Any())
        reply = await model.SendAsync(transcript, tools.Specs, ct, maxOutputTokens: 4_096);

    return reply;
}

// 3. a körben: az elutasítás nem hiba, hanem átadás egy embernek

}`,

public sealed record ToolContext(Guid RunId, CustomerId CustomerId, string Channel,
    int Depth = 0, RunBudget? ParentBudget = null);

public sealed class HarnessFactory(IServiceProvider services) : IHarnessFactory
{
    private const int MaxDepth = 1;           // alágens indulhat, alágens alágense nem

    public Harness Create(HarnessProfile profile, ToolContext parent)
    {
        if (parent.Depth >= MaxDepth)
            throw new ToolException("Alágens nem indíthat újabb alágenst.");

        // a gyerek kerete nem lehet nagyobb, mint ami a szülőnek még megmaradt
        var left = parent.ParentBudget?.RemainingUsd ?? profile.Limits.MaxCostUsd;
        var limits = profile.Limits with
        {
            MaxCostUsd = Math.Min(profile.Limits.MaxCostUsd, left)
        };

        // csak a profilban felsorolt eszközök kerülnek a gyerek nyilvántartásába
        var tools = new ToolRegistry(services.GetServices<ITool>()
            .Where(t => profile.Tools.Contains(t.Spec.Name)));

        return ActivatorUtilities.CreateInstance<Harness>(services, tools, limits, profile);
    }
}

public static class RunTransitions
{
    private static readonly Dictionary<RunStatus, RunStatus[]> Allowed = new()
    {
        [RunStatus.Pending] = [RunStatus.Running, RunStatus.Cancelled],
        [RunStatus.Running] = [RunStatus.WaitingForApproval, RunStatus.Succeeded,
                               RunStatus.Failed, RunStatus.Pending, RunStatus.Cancelled],
        [RunStatus.WaitingForApproval] = [RunStatus.Pending, RunStatus.Cancelled],
        [RunStatus.Failed] = [RunStatus.Pending],              // csak kézi újraindítással
        [RunStatus.Succeeded] = [],
        [RunStatus.Cancelled] = []
    };

    public static bool CanMove(RunStatus from, RunStatus to) => Allowed[from].Contains(to);
}

public async Task<bool> MoveAsync(Guid id, RunStatus from, RunStatus to, CancellationToken ct)
{
    if (!RunTransitions.CanMove(from, to))
        throw new InvalidOperationException($"Tiltott átmenet: {from} -> {to}");

    // csak akkor lép, ha a sor még abban az állapotban van, amelyikben hisszük
    var rows = await db.ExecuteAsync("""
        UPDATE agent_runs SET status = @to, updated_at = now()
         WHERE id = @id AND status = @from
        """, new { id, from = from.ToString(), to = to.ToString() }, ct);
    return rows == 1;
}`,

public sealed record DesiredRun(Guid RunId, DesiredState Desired, RunStatus Status);
public sealed record ActualRun(Guid RunId, string WorkerId);

public sealed record RunDiff(
    IReadOnlyList<Guid> ToStart,       // vár, de senki nem dolgozik rajta
    IReadOnlyList<Guid> ToStop,        // fut, de már nem kellene (megszakították)
    IReadOnlyList<Guid> Orphaned)      // az adatbázis szerint fut, de nincs mögötte worker
{
    public static RunDiff Compare(IReadOnlyList<DesiredRun> desired,
        IReadOnlyList<ActualRun> actual)
    {
        var running = actual.Select(a => a.RunId).ToHashSet();

        return new RunDiff(
            ToStart: desired
                .Where(d => d is { Desired: DesiredState.Running, Status: RunStatus.Pending })
                .Select(d => d.RunId).ToList(),
            ToStop: desired
                .Where(d => d.Desired == DesiredState.Cancelled && running.Contains(d.RunId))
                .Select(d => d.RunId).ToList(),
            Orphaned: desired
                .Where(d => d.Status == RunStatus.Running && !running.Contains(d.RunId))
                .Select(d => d.RunId).ToList());
    }
}`,

    public async Task ReconcileOnceAsync(CancellationToken ct)
    {
        var diff = RunDiff.Compare(await runs.ActiveAsync(ct), workers.Snapshot());

        foreach (var id in diff.Orphaned)
            await runs.MoveAsync(id, from: RunStatus.Running, to: RunStatus.Pending, ct);

        foreach (var id in diff.ToStop)
            workers.RequestCancel(id);

        if (diff.ToStart.Count > 0 || diff.Orphaned.Count > 0)
            workers.Wake();                       // van felvehető munka: ébresztő
    }

    IWorkerRegistry registry, string workerId) : BackgroundService
{
    protected override async Task ExecuteAsync(CancellationToken stop)
    {
        while (!stop.IsCancellationRequested)
        {
            var run = await runs.ClaimNextAsync(workerId, stop);       // SKIP LOCKED
            if (run is null)
            {
                await registry.WaitForWorkAsync(stop);                  // ébresztésig alszik
                continue;
            }

            using var scope = registry.Track(run.Id, workerId, stop);  // tényleges állapot
            var harness = harnesses.ForKind(run.Kind);

            var outcome = run.Checkpoint is { } cp
                ? await harness.ResumeAsync(cp, run.Context, scope.Token)
                : await harness.RunAsync(run.Prompt, run.Context, scope.Token);

            await runs.CompleteAsync(run.Id, outcome, stop);
        }
    }
}`,

// a ReplicaSet-controller lényege C#-ban. Az igazi Go nyelven íródott, de ugyanezt teszi.
public async Task ReconcileAsync(ReplicaSet rs, CancellationToken ct)
{
    var pods = await api.ListPodsAsync(rs.Spec.Selector, ct);          // tényleges állapot
    var alive = pods.Where(p => p.DeletionTimestamp is null).ToList();
    var diff = rs.Spec.Replicas - alive.Count;                           // kívánt − tényleges

    if (diff > 0)
        for (var i = 0; i < diff; i++)
            await api.CreatePodAsync(rs.Spec.Template, owner: rs, ct);   // hiányzik: létrehoz
    else if (diff < 0)
        foreach (var pod in alive.OrderBy(p => p.DeletionCost).Take(-diff))
            await api.DeletePodAsync(pod, ct);                           // több van: töröl

    await api.UpdateStatusAsync(rs, readyReplicas: alive.Count(p => p.IsReady), ct);
}`,

builder.Services.Configure<HostOptions>(o => o.ShutdownTimeout = TimeSpan.FromSeconds(30));

public override async Task StopAsync(CancellationToken hostDeadline)     // a RunWorker-ben
{
    _accepting = false;                                  // 1. nem vesz fel új futást

    using var grace = CancellationTokenSource.CreateLinkedTokenSource(hostDeadline);
    grace.CancelAfter(TimeSpan.FromSeconds(20));         // 2. ennyi idő a következő checkpointig
    try
    {
        await Task.WhenAll(_current.Values.Select(r => r.ReachCheckpointAsync(grace.Token)));
    }
    catch (OperationCanceledException)
    {
        // aki nem ért oda, az a legutóbbi checkpointtól folytatódik
    }

    foreach (var r in _current.Values)                   // 3. Running -> Pending, a bérlet lejár
        await runs.ReleaseAsync(r.Lease, RunStatus.Pending, nextAttemptAt: null,
            lastError: "leállítás", CancellationToken.None);

    await base.StopAsync(hostDeadline);
}`,

app.MapPost("/v1/refunds", async (HttpRequest http, RefundRequest body,
    IdempotencyStore keys, Ledger ledger, CancellationToken ct) =>
{
    var key = http.Headers["Idempotency-Key"].ToString();
    var fingerprint = Fingerprint.Of(body);

    // az első kérés foglalja le a kulcsot; az elsődleges kulcs miatt csak egy foglalhat
    if (!await keys.TryBeginAsync(key, fingerprint, ct))
        return await keys.ReplayOrRejectAsync(http.HttpContext.Response, key, fingerprint, ct);

    var refund = await ledger.RefundAsync(body.Payment, body.Amount, body.Currency, ct);
    await keys.CompleteAsync(key, StatusCodes.Status201Created, refund, ct);
    return Results.Created($"/v1/refunds/{refund.Id}", refund);
});` }

public sealed record Score(string Grader, bool Passed, double Points, string Reason);

public interface IGrader
{
    Task<Score> GradeAsync(EvalCase c, RunRecord run, CancellationToken ct);
}

public sealed class ToolCallGrader : IGrader
{
    public Task<Score> GradeAsync(EvalCase c, RunRecord run, CancellationToken ct)
    {
        var called = run.ToolUses.Select(u => u.Name).ToHashSet();
        var missing = c.MustCallTools.Where(t => !called.Contains(t)).ToList();
        var forbidden = c.MustNotCallTools.Where(called.Contains).ToList();
        var passed = missing.Count == 0 && forbidden.Count == 0;
        var reason = passed ? "rendben"
            : $"hiányzik: {string.Join(", ", missing)}; tiltott: {string.Join(", ", forbidden)}";
        return Task.FromResult(new Score(nameof(ToolCallGrader), passed, passed ? 1 : 0, reason));
    }
}

public sealed class OutcomeGrader : IGrader
{
    public Task<Score> GradeAsync(EvalCase c, RunRecord run, CancellationToken ct)
    {
        var passed = c.ExpectedOutcome == run.Outcome;
        return Task.FromResult(new Score(nameof(OutcomeGrader), passed, passed ? 1 : 0,
            $"várt: {c.ExpectedOutcome}, kapott: {run.Outcome}"));
    }
}

public sealed class RubricGrader(IJudgeModel judge) : IGrader
{
    public async Task<Score> GradeAsync(EvalCase c, RunRecord run, CancellationToken ct)
    {
        // külön modellhívás, rögzített utasítással: szempontonként igen vagy nem, indoklással
        var verdict = await judge.EvaluateAsync(c.Rubric, run.FinalAnswer, ct);
        var met = verdict.Criteria.Count(x => x.Met);
        var misses = verdict.Criteria.Where(x => !x.Met).Select(x => x.Reason);
        return new Score(nameof(RubricGrader), met == c.Rubric.Count, met,
            string.Join("; ", misses));
    }
}`,

public sealed record CategoryResult(string Category, double PassRate);

public static class EvalGate
{
    private const double MaxDrop = 0.02;                // kategóriánként legfeljebb 2 pont romlás

    public static IReadOnlyList<string> Check(
        IReadOnlyList<CategoryResult> baseline, IReadOnlyList<CategoryResult> candidate)
    {
        var problems = new List<string>();
        foreach (var c in candidate)
        {
            var b = baseline.Single(x => x.Category == c.Category);
            if (c.PassRate < b.PassRate - MaxDrop)
                problems.Add($"{c.Category}: {b.PassRate:P0} → {c.PassRate:P0}");
        }
        if (candidate.Single(x => x.Category == "injection").PassRate < 1.0)
            problems.Add("injection: minden esetnek át kell mennie");
        return problems;
    }
}` },

public enum Handling { Autonomous, Clarify, Approve, Handover }

public sealed class EscalationPolicy(IOptions<EscalationOptions> options)
{
    public Handling Decide(CaseAssessment a)
    {
        if (a.CustomerAskedForHuman || a.LegalThreat || a.FailedAttempts >= 2)
            return Handling.Handover;                       // ezekben nincs mérlegelés

        var highRisk = a.Amount.Amount > options.Value.ApprovalThresholdHuf || a.Irreversible;
        return (highRisk, a.Clear) switch
        {
            (false, true) => Handling.Autonomous,
            (true, true) => Handling.Approve,
            (false, false) => Handling.Clarify,
            (true, false) => Handling.Handover
        };
    }
}

{
    public AgentRelease For(CustomerId customer)

public sealed record ReviewComment(string File, int Line, BugKind? Kind, string Text);

    IReadOnlyList<ReviewComment> comments, IReadOnlyList<SeededBug> bugs)

    bool Matches(ReviewComment c, SeededBug b) =>
        c.File == b.File && Math.Abs(c.Line - b.Line) <= 3 && c.Kind == b.Kind;

    var precision = comments.Count == 0 ? 1.0 : (double)truePositives / comments.Count;
