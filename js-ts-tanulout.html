<title>JS + TypeScript-tanulóút</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Elrendezés: bal oldalt az állomások; jobbra térkép → sávok → lépésfej → rajz | kód → magyarázat */
:root{
  --bg:#eceef1; --panel:#fafbfb; --panel-2:#e1e5ea; --ink:#17202b; --muted:#566170;
  --line:#cbd2da; --line-strong:#87929f;
  --accent:#0a6a70; --accent-soft:#d3eaeb;
  --hl:#d9970f; --hl-soft:#f7e5b5;
  --bad:#bb382c; --bad-soft:#f5dbd7; --ok:#2a7a46; --ok-soft:#d6ecdd;
  --code-bg:#151b23; --code-fg:#d9dfe8; --code-dim:#5f6a7a; --code-kw:#e9a46a; --code-ty:#7fc6cb;
  --code-str:#b0d38c; --code-com:#8391a3; --code-num:#d7b3f0;
  --code-hl:rgba(217,151,15,.17); --code-exec:rgba(217,151,15,.36);
  --bad-ink:#ff9384; --ok-ink:#82dca0; --acc-ink:#7fd3d8; --mut-ink:#9ba7b5;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --panel:#171e27; --panel-2:#222b36; --ink:#e2e7ed; --muted:#97a2b0;
    --line:#2a3440; --line-strong:#5e6b7b;
    --accent:#47b4ba; --accent-soft:#143337;
    --hl:#f0b33a; --hl-soft:#3b3015;
    --bad:#ec6b5d; --bad-soft:#3c1f1b; --ok:#5dbf7c; --ok-soft:#163120;
    --code-bg:#0b0f14; --code-fg:#d9dfe8; --code-dim:#556071; --code-kw:#e9a46a; --code-ty:#7fc6cb;
    --code-str:#b0d38c; --code-com:#7d8b9d; --code-num:#d7b3f0;
    --code-hl:rgba(240,179,58,.15); --code-exec:rgba(240,179,58,.32);
    --bad-ink:#b23a2e; --ok-ink:#21703f; --acc-ink:#0a6a70; --mut-ink:#566170;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#171e27; --panel-2:#222b36; --ink:#e2e7ed; --muted:#97a2b0;
  --line:#2a3440; --line-strong:#5e6b7b;
  --accent:#47b4ba; --accent-soft:#143337;
  --hl:#f0b33a; --hl-soft:#3b3015;
  --bad:#ec6b5d; --bad-soft:#3c1f1b; --ok:#5dbf7c; --ok-soft:#163120;
  --code-bg:#0b0f14; --code-fg:#d9dfe8; --code-dim:#556071; --code-kw:#e9a46a; --code-ty:#7fc6cb;
  --code-str:#b0d38c; --code-com:#7d8b9d; --code-num:#d7b3f0;
  --code-hl:rgba(240,179,58,.15); --code-exec:rgba(240,179,58,.32);
  --bad-ink:#b23a2e; --ok-ink:#21703f; --acc-ink:#0a6a70; --mut-ink:#566170;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.page{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,2.6vw,34px);padding-block:18px 56px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:22px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.015em}
.brand b{color:var(--accent);font-weight:800}
.top .sub{color:var(--muted);font-size:13.5px}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:28px;align-items:start}
.stations{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.stations h2,.eyebrow,.key .lab,.mm-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.sthd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding-left:9px}
.navtoggle{display:grid;place-items:center;width:28px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font:700 14px/1 var(--f-mono);cursor:pointer}
.navtoggle:hover{color:var(--ink);border-color:var(--line-strong)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Összecsukott menü: csak az állomások száma látszik, a név az egér alatt */
.nav-min .stations h2,.nav-min .stations .foot,.nav-min .stations .sec,.nav-min .st .t{display:none}
.nav-min .st{grid-template-columns:1fr;justify-items:center;padding:6px 4px;min-width:32px}
.nav-min .st .n{text-align:center}
.stations ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.st{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:baseline;width:100%;padding:6px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:13.5px;text-align:left;cursor:pointer}
.st:hover{background:var(--panel-2)}
.st .n{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted)}
.st.on{background:var(--ink);color:var(--bg);font-weight:600}
.st.on .n{color:var(--bg)}
.st:disabled{cursor:default;color:var(--muted);opacity:.55;background:none}
.st.sep{margin-top:8px}
.stations .foot{margin:12px 9px 0;font-size:12px;color:var(--muted);line-height:1.4}
.stations .sec{margin:12px 9px 3px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stations .sec:first-child{margin-top:0}

.modmap{display:grid;gap:8px;margin-bottom:20px}
.mm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px solid transparent;border-radius:14px;padding:4px}
.mm.on{border-color:var(--hl);background:var(--hl-soft)}
.mm-agg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:12px;padding:7px 9px}
.mm-agg.on{border-color:var(--hl);border-style:solid;background:var(--hl-soft)}
.mm-cap{font:600 12px var(--f-mono);color:var(--muted);margin-right:2px}
.mm-cap i{font-style:normal;opacity:.6;margin-left:5px}
.mm-agg.on .mm-cap{color:var(--ink);font-weight:700}
.mchip{font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mchip i{font-style:normal;opacity:.6;margin-left:5px}
.mchip.on{background:var(--hl-soft);border-color:var(--hl);color:var(--ink);font-weight:700}

.sthead{display:grid;gap:4px;margin-bottom:16px}
.sthead h1{font-size:clamp(28px,3.3vw,40px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.sthead .goal{font-family:var(--f-read);font-size:18px;color:var(--muted);margin:4px 0 0;max-width:62ch}

.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;text-align:left}
.tab small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}

.stephead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:16px 0 12px}
.stephead .ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stephead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{position:relative;width:18px;height:18px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:16px;height:5px;border-radius:3px;background:var(--line)}
.dot.seen::before{background:var(--line-strong)}
.dot.on::before{background:var(--hl);height:7px}
.dot.side::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(8px)}

.work{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:start}
.diagram{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;min-width:0}
.diagram .scroll{overflow-x:auto}
#stage{display:block;width:100%;min-width:540px;height:auto;font-family:var(--f-mono);font-variant-ligatures:none}
#stage text{white-space:pre}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin-top:6px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent)}
.sw.bad{border-top:2px dashed var(--bad)}
.sw.ref{border-top:2px dotted var(--muted)}
.sw.hl{border-top:3px solid var(--hl)}
.replay{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px}
.replay:hover{color:var(--ink)}

/* A kód doboza teljes magasságú, görgetősáv nélkül. Ha szélesebb az oszlopánál, jobbra kilóg, legfeljebb
   az ablak széléig; ha ott sem fér el, a layoutCode() a rajz alá teszi, keskeny képernyőn a sor törik. */
.code{background:var(--code-bg);border-radius:10px;overflow:hidden;width:max-content;min-width:100%;justify-self:start;display:flex;flex-direction:column}
/* a fejléc és a fájlcímkék nem szélesítik a dobozt (width:0 + min-width:100%), inkább törnek */
.code-head{display:flex;flex-wrap:wrap;width:0;min-width:100%;justify-content:space-between;gap:4px 10px;padding:9px 14px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--code-dim);border-bottom:1px solid rgba(255,255,255,.06)}
.code-head .cfile{text-transform:none;letter-spacing:0;color:var(--code-fg);font-weight:500;margin-right:8px;overflow-wrap:anywhere}
#code{position:relative;margin:0;padding:8px 0 12px;overflow:visible;font:12.5px/1.62 var(--f-mono);color:var(--code-fg);font-variant-ligatures:none}
.code.wrap .cl{white-space:break-spaces;width:auto;min-width:0;grid-template-columns:40px minmax(0,1fr)}
.code.wrap .cl .tx{overflow-wrap:anywhere}
.work.stack{grid-template-columns:minmax(0,1fr)}
.work.stack > .diagram{position:static;max-width:820px}
.cl{display:grid;grid-template-columns:40px auto;width:max-content;min-width:100%;padding-right:16px;white-space:pre;cursor:default;transition:background .25s}
.cl .no{color:var(--code-dim);text-align:right;padding-right:14px;user-select:none}
.cl.hl{background:var(--code-hl)}
.cl.hv,.cl.exec{background:var(--code-exec)}
.cl.exec .no{color:var(--hl)}
.cl.exec{box-shadow:inset 3px 0 0 var(--hl)}
.k{color:var(--code-kw)} .y{color:var(--code-ty)} .s{color:var(--code-str)} .c{color:var(--code-com);font-style:italic} .n,.d{color:var(--code-num)}
.cf{width:0;min-width:100%;padding:10px 16px 4px 54px;font:500 11.5px var(--f-mono);color:var(--code-dim);white-space:normal;overflow-wrap:anywhere}
.cf:not(:first-child){margin-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.cf b{color:var(--code-fg);font-weight:500;margin-right:8px}

.below{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;margin-top:20px;align-items:start}
.why{font-family:var(--f-read);font-size:17.5px;line-height:1.62;max-width:68ch}
.why p{margin:0 0 .75em}
.why code{font-family:var(--f-mono);font-size:.8em;background:var(--panel-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.why b{font-weight:600}
.key{margin-top:14px;padding-top:10px;border-top:2px solid var(--ink)}
.key p{margin:6px 0 0;font-family:var(--f-display);font-size:16px;line-height:1.5;font-weight:500}
.links{display:grid;gap:8px;justify-items:start}
.side-link,.next-link{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left;font-size:14px;max-width:300px}
.next-link{border-color:var(--ink);background:var(--panel)}
.side-link .lab,.next-link .lab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.next-link .lab{color:var(--muted)}
.see-link{border:1px dashed var(--line-strong);background:none;border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13.5px;max-width:300px}
.see-link b{font-weight:700}
.back-link{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;max-width:300px}
.hint{font-size:12.5px;color:var(--muted);max-width:300px;margin:4px 0 0}

/* SVG */
.node{transition:transform .7s cubic-bezier(.2,.75,.2,1),opacity .45s ease}
.node .shape{fill:var(--panel);stroke:var(--line-strong);stroke-width:1.3}
.node .ttl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.node .sub{font-size:10.5px;fill:var(--muted);font-style:italic}
.node .sep{stroke:var(--line)}
.node .ln{font-size:12px;fill:var(--ink)}
.node .lt-bad{fill:var(--bad)} .node .lt-ok{fill:var(--ok)} .node .lt-muted{fill:var(--muted)} .node .lt-new{fill:var(--accent)}
.node .lbl{font-size:12.5px;fill:var(--ink)}
.k-state .lbl{font-weight:600}
.k-actor .shape{fill:var(--bg);stroke-dasharray:4 3}
.k-actor .lbl{font-style:italic;fill:var(--muted);font-size:12px}
.k-note .shape{fill:transparent;stroke:none}
.k-note .lbl{font-size:11.5px;fill:var(--muted)}
.k-note.t-bad .shape{fill:var(--bad-soft)} .k-note.t-bad .lbl{fill:var(--bad)}
.k-note.t-ok .shape{fill:var(--ok-soft)} .k-note.t-ok .lbl{fill:var(--ok)}
.k-note.t-accent .shape{fill:var(--accent-soft)} .k-note.t-accent .lbl{fill:var(--accent)}
.k-group .shape{fill:color-mix(in srgb,var(--panel-2) 40%,transparent);stroke:var(--line-strong);stroke-width:1.4;stroke-dasharray:6 4}
.k-group .glbl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.04em}
.k-group.t-accent .shape{stroke:var(--accent);fill:color-mix(in srgb,var(--accent-soft) 55%,transparent)} .k-group.t-accent .glbl{fill:var(--accent)}
.k-group.t-current .shape{stroke:var(--hl);fill:color-mix(in srgb,var(--hl-soft) 55%,transparent)} .k-group.t-current .glbl{fill:var(--ink)}
.k-group.t-bad .shape{stroke:var(--bad);fill:color-mix(in srgb,var(--bad-soft) 45%,transparent)} .k-group.t-bad .glbl{fill:var(--bad)}
.k-group.t-ok .shape{stroke:var(--ok);fill:color-mix(in srgb,var(--ok-soft) 45%,transparent)} .k-group.t-ok .glbl{fill:var(--ok)}
.k-group.t-muted .shape{stroke:var(--line)}
.t-current:not(.k-group) .shape{fill:var(--ink);stroke:var(--ink)}
.t-current:not(.k-group) .lbl,.t-current:not(.k-group) .ttl,.t-current:not(.k-group) .ln,.t-current:not(.k-group) .sub{fill:var(--bg)}
.t-new:not(.k-group):not(.k-note) .shape{fill:var(--accent-soft);stroke:var(--accent)}
.t-bad:not(.k-note):not(.k-group) .shape{stroke:var(--bad)}
.t-bad:not(.k-note):not(.k-group) .ttl{fill:var(--bad)}
.t-ok:not(.k-note):not(.k-group) .shape{stroke:var(--ok)}
.t-muted:not(.k-group) .shape{stroke:var(--line)}
.t-muted:not(.k-group) text{fill:var(--muted)}
.chip{fill:var(--panel-2)} .chipt{font-size:10.5px;fill:var(--muted)}
.chip.ct-bad{fill:var(--bad-soft)} .chipt.ct-bad{fill:var(--bad)}
.chip.ct-ok{fill:var(--ok-soft)} .chipt.ct-ok{fill:var(--ok)}
.t-current .chip{fill:var(--line-strong)} .t-current .chipt{fill:var(--bg)}
.t-current:not(.k-group) .ln.lt-bad{fill:var(--bad-ink)} .t-current:not(.k-group) .ln.lt-ok{fill:var(--ok-ink)}
.t-current:not(.k-group) .ln.lt-new{fill:var(--acc-ink)} .t-current:not(.k-group) .ln.lt-muted{fill:var(--mut-ink)}
.t-current .chip.ct-bad{fill:var(--bad-soft)} .t-current .chipt.ct-bad{fill:var(--bad)}
.t-current .chip.ct-ok{fill:var(--ok-soft)} .t-current .chipt.ct-ok{fill:var(--ok)}
.axis{stroke:var(--line-strong);stroke-width:1.5;fill:none}
.tick{stroke:var(--line-strong);stroke-width:1.5}
.tick.strong{stroke:var(--hl);stroke-width:3}
.tl{font-size:11px;fill:var(--muted)} .tl.strong{fill:var(--ink);font-weight:700}
.node.hl .shape,.node.hv .shape{stroke:var(--hl);stroke-width:2.6}
.k-note.hl .shape,.k-note.hv .shape{stroke:var(--hl);stroke-width:1.6}
.k-group.hl .shape,.k-group.hv .shape{stroke-dasharray:none}
.node.hl:not(.k-group),.node.hv:not(.k-group){filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hl) 45%,transparent))}
.node.ping .shape{animation:ping .7s ease}
@keyframes ping{0%{stroke:var(--hl);stroke-width:5}100%{}}

.edge{animation:fadeIn .45s ease both}
.edge.gone{animation:none;opacity:0;transition:opacity .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ep{fill:none;stroke-width:1.6}
.e-ok .ep{stroke:var(--accent);marker-end:url(#mk-ok)}
.e-muted .ep{stroke:var(--line-strong);marker-end:url(#mk-muted)}
.e-bad .ep{stroke:var(--bad);stroke-dasharray:6 4;marker-end:url(#mk-bad)}
.e-ref .ep{stroke:var(--muted);stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:2;marker-end:url(#mk-ref)}
.e-inherit .ep{stroke:var(--line-strong);marker-end:url(#mk-inh)}
.edge.hl .ep,.edge.hv .ep{stroke:var(--hl);stroke-width:2.6;marker-end:url(#mk-hl)}
.elbl,.mlbl{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.e-bad .elbl{fill:var(--bad)}
.e-ref .elbl{fill:var(--muted)}
.msg .mp{fill:none;stroke-width:2.3}
.m-ok .mp,.m-ret .mp{stroke:var(--accent)} .m-bad .mp{stroke:var(--bad)}
.msg.done.m-ok .mp,.msg.done.m-ret .mp{marker-end:url(#mk-ok)}
.msg.done.m-bad .mp{marker-end:url(#mk-bad)}
.msg.done.m-ret .mp{stroke-dasharray:5 4}
.mdot{fill:var(--hl);stroke:var(--panel);stroke-width:2;opacity:0}
.msg.run .mdot{opacity:1} .msg.done .mdot{opacity:0}
.msg.wait{opacity:0}
.mlbl{font-weight:700;opacity:0;transition:opacity .3s}
.msg.run .mlbl,.msg.done .mlbl{opacity:1}
.m-bad .mlbl{fill:var(--bad)} .m-ok .mlbl,.m-ret .mlbl{fill:var(--accent)}
.mk-ok{fill:var(--accent)} .mk-muted{fill:var(--line-strong)} .mk-bad{fill:var(--bad)} .mk-hl{fill:var(--hl)}
.mk-ref{fill:none;stroke:var(--muted);stroke-width:1.6}
.mk-inh{fill:var(--panel);stroke:var(--line-strong);stroke-width:1.2}

.empty{padding:40px 0;color:var(--muted);font-family:var(--f-read);font-size:18px}

@media (min-width:1181px){
  /* hosszú kódnál a rajz a képernyőn marad, amíg a kódot olvasod */
  .work > .diagram{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
}
@media (min-width:861px){

<script>
/* Tanulóutak: közös geometria és a közös elemkészlet.
   A felület (shell.html) és az ellenőrző (tools/check.mjs) ugyanezt a fájlt tölti be,
   így a méretszámítás egy helyen él. Az utak saját nyilvántartása a src/courses/<út>/course.json. */
(function (root) {
  "use strict";

  /* Karakterszélesség (px) a JetBrains Mono betűhöz, az adott betűmérettel. */
  const CH = { state: 7.8, actor: 7.2, note: 6.9, line: 7.2, title: 7.8, sub: 6.3, chip: 6.6, label: 6.6, mlabel: 7.0 };
  const VIEW = { w: 640, h: 420 };

  const lt = l => (typeof l === "string" ? { t: l } : l);

  function size(n) {
    switch (n.kind) {
      case "state": return { w: n.w || Math.round(n.label.length * CH.state + 30), h: 32 };
      case "actor": return { w: n.w || Math.round(n.label.length * CH.actor + 28), h: 30 };
      case "note": {
        const ls = n.text.split("\n");
        return { w: n.w || Math.round(Math.max(...ls.map(s => s.length)) * CH.note + 18), h: ls.length * 16 + 10 };
      }
      case "timeline": return { w: n.w, h: 46 };
      case "group": return { w: n.w, h: n.h };
      default: {
        const lines = (n.lines || []).map(lt);
        const h = n.h || ((n.sub ? 44 : 30) + (lines.length ? lines.length * 19 + 10 : 4));
        const w = n.w || Math.round(Math.max(n.title.length * CH.title,
          ...lines.map(l => l.t.length * CH.line + (l.chip ? l.chip.length * CH.chip + 24 : 0))) + 24);
        return { w, h };
      }
    }
  }

  /* Egy doboz i-edik sorának függőleges közepe a doboz középpontjához képest. */
  function lineCenterY(n, i) {
    const { h } = size(n);
    return -h / 2 + (n.sub ? 44 : 30) + 19 + i * 19 - 4;
  }

  function rect(n) {
    const { w, h } = size(n);
    return { x1: n.x - w / 2, y1: n.y - h / 2, x2: n.x + w / 2, y2: n.y + h / 2 };
  }

  function anchor(n, toward, lineIdx) {
    const { w, h } = size(n);
    if (lineIdx != null && n.kind === "box") {
      const right = toward.x >= n.x;
      return { x: n.x + (right ? w / 2 + 3 : -w / 2 - 3), y: n.y + lineCenterY(n, lineIdx) };
    }
    let dx = toward.x - n.x, dy = toward.y - n.y;
    if (!dx && !dy) dy = 1;
    const sx = dx ? (w / 2) / Math.abs(dx) : Infinity, sy = dy ? (h / 2) / Math.abs(dy) : Infinity;
    const s = Math.min(sx, sy), len = Math.hypot(dx, dy);
    const k = s + 4 / len;
    return { x: n.x + dx * k, y: n.y + dy * k };
  }

  /* Hurok: él ugyanabból a csomópontból önmagába, a megadott sarkon (tr, tl, br, bl). */
  function loopGeom(n, corner) {
    const { w, h } = size(n);
    const sx = /l/.test(corner || "") ? -1 : 1, sy = /b/.test(corner || "") ? 1 : -1;
    const p1 = { x: n.x + sx * (w / 2 - 16), y: n.y + sy * (h / 2 + 3) };
    const p2 = { x: n.x + sx * (w / 2 + 3), y: n.y + sy * (h / 2 - 12) };
    const c = { x: n.x + sx * (w / 2 + 36), y: n.y + sy * (h / 2 + 36) };
    const f = v => Math.round(v * 10) / 10;
    return {
      d: `M${f(p1.x)},${f(p1.y)} Q${f(c.x)},${f(c.y)} ${f(p2.x)},${f(p2.y)}`,
      lx: .25 * p1.x + .5 * c.x + .25 * p2.x + sx * 6, ly: .25 * p1.y + .5 * c.y + .25 * p2.y + sy * 8, p1, c, p2
    };
  }

  /* Él vagy üzenet útvonala két csomópont között; a görbület a merőleges eltolás aránya. */
  function geom(a, b, curve, fromLine, toLine, loop) {
    if (a === b) return loopGeom(a, loop);
    const a0 = (fromLine != null && a.kind === "box") ? { x: a.x, y: a.y + lineCenterY(a, fromLine) } : { x: a.x, y: a.y };
    const b0 = (toLine != null && b.kind === "box") ? { x: b.x, y: b.y + lineCenterY(b, toLine) } : { x: b.x, y: b.y };
    const dx = b0.x - a0.x, dy = b0.y - a0.y;
    const c = curve ? { x: (a0.x + b0.x) / 2 - dy * curve, y: (a0.y + b0.y) / 2 + dx * curve } : null;
    const p1 = anchor(a, c || b0, fromLine), p2 = anchor(b, c || a0, toLine);
    const f = v => Math.round(v * 10) / 10;
    if (c) {
      return {
        d: `M${f(p1.x)},${f(p1.y)} Q${f(c.x)},${f(c.y)} ${f(p2.x)},${f(p2.y)}`,
        lx: .25 * p1.x + .5 * c.x + .25 * p2.x, ly: .25 * p1.y + .5 * c.y + .25 * p2.y, p1, c, p2
      };
    }
    return { d: `M${f(p1.x)},${f(p1.y)} L${f(p2.x)},${f(p2.y)}`, lx: (p1.x + p2.x) / 2, ly: (p1.y + p2.y) / 2, p1, c: null, p2 };
  }

  /* A motor elemkészlete; minden úton ugyanez. */
  const REGISTRY = {
    kinds: ["box", "state", "actor", "note", "timeline", "group"],
    tones: ["current", "new", "bad", "ok", "muted", "accent"],
    edgeKinds: ["ok", "muted", "bad", "ref", "inherit"],
    msgKinds: ["ok", "bad", "ret"],
    langs: ["cs", "ts", "tsx", "js", "py", "sql", "json", "yaml", "html", "razor", "bash", "http", "md", "text"],
    loops: ["tr", "tl", "br", "bl"]
  };

  const h = {
    bad: t => ({ t, tone: "bad" }),
    ok: t => ({ t, tone: "ok" }),
    mut: t => ({ t, tone: "muted" }),
    neu: t => ({ t, tone: "new" })
  };

  root.OOPGeom = { CH, VIEW, lt, size, lineCenterY, rect, anchor, geom, REGISTRY };
  root.OOP = root.OOP || {
    stations: {}, courseDef: null,
    station(def) { this.stations[def.id] = def; },
    course(def) { this.courseDef = def; }
  };
  root.OOP.h = h;
  /* Kódblokk szó szerint: raw`...` megtartja a visszaperjeleket (\n, \d), csak a \` és a \${ jelölést
     alakítja vissza backtickké és ${-vé, a <\/ jelölést pedig </-vé (így a záró script-címke is leírható).
     Így TS-, Python- és HTML-kód is beírható úgy, ahogy van. */
  root.OOP.raw = (strings, ...vals) => {
    if (vals.length) throw new Error("raw`...`: a kódblokkban nem lehet ${...} behelyettesítés; írd így: \\${");
    return strings.raw[0].replace(/\\`/g, "`").replace(/\\\$\{/g, "${").replace(/<\\\//g, "</");
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Tanulóutak: kódszínezés több nyelvre.
   A felület és a tools/ alatti próbák is ezt töltik be. Soronként színez, de a több soron átnyúló
   elemeket (blokk-komment, többsoros sztring, sablon-sztring) a sorok között is viszi.
   Osztályok: k kulcsszó, y típus vagy címke, s sztring, c komment, n szám, d dekorátor. */
(function (root) {
  "use strict";
  const words = s => new Set(s.trim().split(/\s+/));

  const CS_KW = "public private protected internal sealed abstract class record struct interface enum void return new throw if else switch case break continue default var static readonly override virtual get set init using bool string decimal int long double float byte char is or and not null true false this base nameof out ref in async await yield foreach for while do try catch finally where when with const params partial delegate event operator implicit explicit typeof object namespace required lock goto checked unchecked dynamic";
  const TS_KW = "const let var function return if else for while do switch case break continue new class extends implements interface type enum import export from as default async await yield try catch finally throw typeof instanceof in of keyof readonly public private protected static abstract declare namespace void null undefined true false this super satisfies infer never unknown any string number boolean bigint symbol object get set is asserts override accessor";
  const PY_KW = "def class return if elif else for while in not and or is None True False import from as with async await yield lambda try except finally raise pass break continue global nonlocal del assert match case self cls";
  const SQL_KW = "select from where insert into values update set delete create table index on primary key foreign references not null unique and or in is join left right inner outer group by order having limit offset as begin commit rollback transaction for skip locked nowait returning with distinct count sum min max default check constraint union all exists case when then else end isolation level serializable read committed repeatable varchar int integer bigint text timestamp timestamptz boolean decimal numeric uuid serial bigserial jsonb alter add drop if partition range hash replica conflict do nothing now interval asc desc true false";
  const BASH_KW = "if then else elif fi for in do done while until case esac function return export local readonly set unset source exit";

  const SPEC = {
    cs: { kw: words(CS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [['"""', '"""', false]], quotes: ['"', "'"], prefix: /[$@]{1,3}(?=")/y },
    ts: { kw: words(TS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [["`", "`", true]], quotes: ['"', "'"], deco: true, dollar: true },
    js: { kw: words(TS_KW), cap: true, line: ["//"], block: [["/*", "*/"]], multi: [["`", "`", true]], quotes: ['"', "'"], deco: true, dollar: true },
    py: { kw: words(PY_KW), ty: words("str int float bool list dict set tuple bytes object type"), cap: true, line: ["#"], block: [],
          multi: [['"""', '"""', true], ["'''", "'''", true]], quotes: ['"', "'"], prefix: /(?:rb|br|fr|rf|[rbfu])(?=["'])/iy, deco: true },
    sql: { kw: words(SQL_KW), nocase: true, line: ["--"], block: [["/*", "*/"]], multi: [], quotes: ["'"] },
    json: { kw: words("true false null"), line: [], block: [], multi: [], quotes: ['"'], keys: true },
    yaml: { kw: words("true false null yes no on off"), line: ["#"], block: [], multi: [], quotes: ['"', "'"], yamlKeys: true },
    html: { kw: new Set(), line: [], block: [["<!--", "-->"]], multi: [], quotes: ['"', "'"], tags: "always" },
    razor: { kw: words(CS_KW), cap: true, line: [], block: [["@*", "*@"], ["<!--", "-->"]], multi: [], quotes: ['"', "'"], tags: "always", razor: true },
    bash: { kw: words(BASH_KW), line: ["#"], block: [], multi: [], quotes: ['"', "'"], vars: true },
    http: { kw: words("GET POST PUT PATCH DELETE HEAD OPTIONS HTTP true false null"), line: [], block: [], multi: [], quotes: ['"'], yamlKeys: true, keys: true },
    text: { kw: new Set(), line: [], block: [], multi: [], quotes: [] }
  };
  SPEC.tsx = Object.assign({}, SPEC.ts, { tags: "jsx" });

  const LABELS = { cs: "C#", ts: "TypeScript", tsx: "TSX", js: "JavaScript", py: "Python", sql: "SQL", json: "JSON",
    yaml: "YAML", html: "HTML", razor: "Razor", bash: "Shell", http: "HTTP", md: "Markdown", text: "Szöveg" };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /* A záró jel helye a from indextől; a visszaperrel védett jelet átugorja. Visszaad: a záró jel utáni index, vagy -1. */
  function findEnd(line, from, end, escapes) {
    for (let i = from; i <= line.length - end.length; i++) {
      if (escapes && line[i] === "\\") { i++; continue; }
      if (line.startsWith(end, i)) return i + end.length;
    }
    return -1;
  }

  const ID = /[A-Za-z_][A-Za-z0-9_]*/y, ID_DOLLAR = /[A-Za-z_$][A-Za-z0-9_$]*/y;
  const NUM = /0[xX][0-9a-fA-F_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?[A-Za-z]?/y;
  const at = (re, s, i) => { re.lastIndex = i; const m = re.exec(s); return m ? m[0] : null; };

  /* Markdown: címsor, felsorolásjel, félkövér, kódrészlet, link címe, HTML-komment, kódkerítés és YAML-fejléc.
     A kerítésen belüli sorokat nem színezi (azok bármilyen nyelvűek lehetnek). */
  function highlightMd(lines) {
    let fence = false, front = false;
    return lines.map((line, n) => {
      if (n === 0 && /^---\s*$/.test(line)) { front = true; return `<span class="c">${esc(line)}</span>`; }
      if (front) {
        if (/^---\s*$/.test(line)) { front = false; return `<span class="c">${esc(line)}</span>`; }
        return highlight([line], "yaml")[0];
      }
      if (/^\s*(```|~~~)/.test(line)) { fence = !fence; return `<span class="c">${esc(line)}</span>`; }
      if (fence) return esc(line);
      if (/^\s*<!--.*-->\s*$/.test(line)) return `<span class="c">${esc(line)}</span>`;
      if (/^#{1,6}\s/.test(line)) return `<span class="k">${esc(line)}</span>`;
      let html = "", i = 0;
      const b = /^(\s*)([-*+]|\d+\.)(\s+)/.exec(line);
      if (b) { html += esc(b[1]) + `<span class="y">${esc(b[2])}</span>` + b[3]; i = b[0].length; }
      const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)]+\))|(<!--.*?-->)/g;
      re.lastIndex = i;
      let m;
      while ((m = re.exec(line))) {
        html += esc(line.slice(i, m.index));
        if (m[1]) html += `<span class="s">${esc(m[1])}</span>`;
        else if (m[2]) html += `<span class="k">${esc(m[2])}</span>`;
        else if (m[3]) { const k = m[3].indexOf("]("); html += esc(m[3].slice(0, k + 1)) + `<span class="c">${esc(m[3].slice(k + 1))}</span>`; }
        else html += `<span class="c">${esc(m[4])}</span>`;
        i = m.index + m[0].length;
      }
      return html + esc(line.slice(i));
    });
  }

    const L = SPEC[lang] || SPEC.text;
    let carry = null;
    return lines.map(line => {
      let i = 0, html = "", prev = "", lastKw = false;
      const push = (cls, s) => { if (!s) return; html += cls ? `<span class="${cls}">${esc(s)}</span>` : esc(s); if (/\S/.test(s)) { prev = s.trim().slice(-1); lastKw = false; } };
      if (carry) {
        const j = findEnd(line, 0, carry.end, carry.esc);
        if (j < 0) { push(carry.cls, line); return html; }
        push(carry.cls, line.slice(0, j)); i = j; carry = null;
      }
      if (L.yamlKeys) {
        const m = /^(\s*(?:-\s+)?)([\w.\/-]+)(\s*:)(?=\s|$)/.exec(line);
        if (m) { push("", m[1]); push("y", m[2]); push("", m[3]); i = m[0].length; }
      }
      scan: while (i < line.length) {
        const ch = line[i];
        if (ch === " " || ch === "\t") { const j = line.slice(i).search(/\S/); const n = j < 0 ? line.length - i : j; html += line.slice(i, i + n); i += n; continue; }
        for (const [open, close] of L.block) {
          if (line.startsWith(open, i)) {
            const j = findEnd(line, i + open.length, close, false);
            if (j < 0) { push("c", line.slice(i)); carry = { end: close, cls: "c", esc: false }; return html; }
            push("c", line.slice(i, j)); i = j; continue scan;
          }
        }
        for (const lc of L.line) {
          if (line.startsWith(lc, i) && !(lc === "#" && L.vars && line[i - 1] === "$")) { push("c", line.slice(i)); return html; }
        }
        let pre = "";
        if (L.prefix) { const p = at(L.prefix, line, i); if (p) pre = p; }
        const q0 = i + pre.length;
        for (const [open, close, escapes] of L.multi) {
          if (line.startsWith(open, q0)) {
            const j = findEnd(line, q0 + open.length, close, escapes);
            if (j < 0) { push("s", line.slice(i)); carry = { end: close, cls: "s", esc: escapes }; return html; }
            push("s", line.slice(i, j)); i = j; continue scan;
          }

          const q = line[q0];

          if (j < 0) j = line.length;
          const s = line.slice(i, j);
          const isKey = L.keys && /^\s*:/.test(line.slice(j));
          push(isKey ? "y" : "s", s); i = j; continue;

    code: raw`
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function withRetry(fn, { attempts = 3, delayMs = 500 } = {}) {
  return async (...args) => {
    let lastError;
    for (let i = 1; i <= attempts; i++) {
      try {
        return await fn(...args);
      } catch (err) {
        lastError = err;
        if (i < attempts) await sleep(delayMs * i);   // 500, majd 1000 ms várakozás
      }
    }
    throw lastError;
  };
}

function withTimeout(fn, ms) {
  return (...args) =>
    Promise.race([
      fn(...args),
      sleep(ms).then(() => { throw new Error(\`időtúllépés: \${ms} ms\`); }),
    ]);
}

const robustSearch = withTimeout(withRetry(search.run, { attempts: 3 }), 5000);
const hits = await robustSearch({ query: "újrapróbálás" });`,

export const append = (messages, ...msgs) => [...messages, ...msgs];

export const toolUsesOf = (msg) => msg.content.filter((b) => b.type === "tool_use");

export function openToolUses(messages) {
  const answered = new Set(
    messages.flatMap((m) => m.content)
      .filter((b) => b.type === "tool_result")
      .map((b) => b.tool_use_id),
  );
  return messages.flatMap(toolUsesOf).filter((u) => !answered.has(u.id));
}

export function totalUsage(replies) {
  return replies.reduce(
    (acc, { usage: { input_tokens = 0, output_tokens = 0 } = {} }) => ({
      input: acc.input + input_tokens,
      output: acc.output + output_tokens,
    }),
    { input: 0, output: 0 },
  );
}

export const snapshot = (messages) => structuredClone(messages);  // mentéshez, naplóhoz

export async function runAgent(userText, { model, tools, maxTurns = 10, signal, onText }) {
  const runSignal = AbortSignal.any([signal, AbortSignal.timeout(120_000)]);
  const messages = [{ role: "user", content: [{ type: "text", text: userText }] }];

  for (let turn = 1; turn <= maxTurns; turn++) {
    runSignal.throwIfAborted();

    const reply = await collect(model.stream(messages, tools.specs, { signal: runSignal }), onText);
    messages.push({ role: "assistant", content: reply.content });
    if (reply.stop_reason !== "tool_use") return reply;

    const uses = reply.content.filter(b => b.type === "tool_use");
    const settled = await Promise.allSettled(uses.map(use => {
      const toolSignal = AbortSignal.any([runSignal, AbortSignal.timeout(30_000)]);
      return tools.run(use, { signal: toolSignal });
    }));

    const toolResults = settled.map((s, i) => s.status === "fulfilled"
      ? s.value
      : { type: "tool_result", tool_use_id: uses[i].id,
          content: String(s.reason), is_error: true });
    messages.push({ role: "user", content: toolResults });
  }
  throw new Error(\`Elfogyott a \${maxTurns} kör\`);
}

// a stream eseményeiből összerakja a teljes választ, közben kiírja a szöveget
async function collect(events, onText) {
  const content = [];
  let stop_reason = "end_turn";
  for await (const event of events) {
    if (event.type === "content_block_delta" && event.delta.type === "text_delta") {
      onText?.(event.delta.text);
    }
    if (event.type === "content_block_stop") content.push(event.block);
    if (event.type === "message_delta") stop_reason = event.delta.stop_reason;
  }
  return { content, stop_reason };
}`,

import { EventEmitter } from "node:events";

export class Orchestrator extends EventEmitter {
  async run(task) {
    const runId = crypto.randomUUID();
    this.emit("run:started", { runId, task });
    try {
      const result = await this.#dispatch(runId, task);
      this.emit("run:finished", { runId, result });

    } catch (error) {
      this.emit("run:failed", { runId, error });
      throw error;
    }
  }

// importok: fork (node:child_process), EventEmitter (node:events), path (node:path)
export class Orchestrator extends EventEmitter {
  #queue = [];
  #idle = [];
  #pending = new Map();                        // runId → { resolve, reject, task }
  constructor({ size = 2 } = {}) {
    super();
    for (let i = 0; i < size; i++) this.#startWorker();
  }

  submit(task) {
    const runId = crypto.randomUUID();
    return new Promise((resolve, reject) => {
      this.#pending.set(runId, { resolve, reject, task });
      this.#queue.push(runId);
      this.#dispatch();
    });
  }
  #dispatch() {
    while (this.#idle.length && this.#queue.length) {
      const worker = this.#idle.pop(), runId = this.#queue.shift();
      worker.runId = runId;
      worker.send({ type: "run", runId, task: this.#pending.get(runId).task });
      this.emit("run:started", { runId });
    }
  }
  #startWorker() {
    const w = fork(path.join(import.meta.dirname, "worker.js"));
    w.on("message", (msg) => {
      if (msg.type === "ready") { this.#idle.push(w); this.#dispatch(); }
      if (msg.type === "done") {
        this.#pending.get(msg.runId)?.resolve(msg.result);
        this.#pending.delete(msg.runId);
        this.emit("run:finished", { runId: msg.runId });
        this.#idle.push(w); this.#dispatch();
      }
    });
    w.on("exit", () => {                       // a futás vissza a sorba, új worker (előző lépés)
      if (w.runId && this.#pending.has(w.runId)) this.#queue.unshift(w.runId);
      this.#idle = this.#idle.filter(x => x !== w);
      setTimeout(() => this.#startWorker(), 1_000);
    });
  }
}`,

    code: raw`
// egy esemény: "event:" és "data:" sorok, a végét egy üres sor jelzi
async function* readSse(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) return;
    buffer += value.replace(/\r\n/g, "\n");
    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const raw = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      yield parseEvent(raw);
    }
  }
}

function parseEvent(raw) {
  let type = "message";
  const data = [];
  for (const line of raw.split("\n")) {
    if (line.startsWith(":")) continue;                    // megjegyzés vagy életjel
    const colon = line.indexOf(":");
    const field = colon === -1 ? line : line.slice(0, colon);
    const value = colon === -1 ? "" : line.slice(colon + 1).replace(/^ /, "");
    if (field === "event") type = value;
    else if (field === "data") data.push(value);
  }
  return { type, data: data.join("\n") };
}

for await (const event of readSse(response)) {
  if (event.type === "text") appendText(answer, JSON.parse(event.data).text);
  else if (event.type === "tool") showStatus("Eszköz fut: " + JSON.parse(event.data).name);
  else if (event.type === "done") break;
}`,

import { renderMessage, appendText } from "./render.js";

stopButton.addEventListener("click", () => current?.abort());

async function ask(text, answer) {
  current?.abort();
  current = new AbortController();
  stopButton.disabled = false;
  try {

      method: "POST", headers: { "Content-Type": "application/json" },

    answer.textContent += " [" + note + "]";
  } finally {
    stopButton.disabled = true;
  }
}` }

  if (typeof content === "string") {
    return { text: content, toolUses: [] as ToolUseBlock[] };

export class ToolRegistry<TTools extends Record<string, Tool>> {
  constructor(private readonly tools: TTools) {}

  get<K extends keyof TTools & string>(name: K): TTools[K] {

  }

  names(): (keyof TTools & string)[] {
    return Object.keys(this.tools) as (keyof TTools & string)[];

export async function withRetry<T>(
  fn: (attempt: number) => Promise<T>,
  { attempts = 3, delayMs = 500 }: { attempts?: number; delayMs?: number } = {},
): Promise<T> {
  for (let attempt = 1; ; attempt++) {
    try {
      return await fn(attempt);
    } catch (err) {
      if (attempt >= attempts) throw err;
      await new Promise(resolve => setTimeout(resolve, delayMs * 2 ** (attempt - 1)));
    }
  }
}

export async function withTimeout<T>(promise: Promise<T>, ms: number): Promise<T> {
  let timer: ReturnType<typeof setTimeout> | undefined;
  const timeout = new Promise<never>((_, reject) => {
    timer = setTimeout(() => reject(new Error(\`időtúllépés: \${ms} ms\`)), ms);
  });
  try {
    return await Promise.race([promise, timeout]);
  } finally {
    clearTimeout(timer);
  }
}

export type Result<T, E = Error> = { ok: true; value: T } | { ok: false; error: E };
export const ok = <T>(value: T): Result<T, never> => ({ ok: true, value });
export const err = <E>(error: E): Result<never, E> => ({ ok: false, error });

export const firstOf = <T>(items: readonly T[]): T | undefined => items[0];

export const byName = <T extends { name: string }>(items: readonly T[], name: string) =>
  items.find(item => item.name === name);

export const pluck = <T, K extends keyof T>(obj: T, key: K): T[K] => obj[key];

export async function withRetry<T>(fn: (attempt: number) => Promise<T>, attempts = 3) {
  for (let attempt = 1; ; attempt++) {
    try { return await fn(attempt); }
    catch (e) { if (attempt >= attempts) throw e; }
  }
}

export async function withTimeout<T>(promise: Promise<T>, ms: number): Promise<T> {
  let timer: ReturnType<typeof setTimeout> | undefined;
  const timeout = new Promise<never>((_, reject) => {
    timer = setTimeout(() => reject(new Error(\`időtúllépés: \${ms} ms\`)), ms);
  });
  try { return await Promise.race([promise, timeout]); }
  finally { clearTimeout(timer); }
}

import { z } from "zod";

interface ToolDef<S extends z.ZodTypeAny, O> {
  name: string; description: string; schema: S; readOnly: boolean;
  run(input: z.infer<S>, ctx: ToolContext): Promise<O>;
}

// az azonosság-függvény csak a típusokat köti össze
function defineTool<S extends z.ZodTypeAny, O>(def: ToolDef<S, O>): ToolDef<S, O> {
  return def;
}

const tools = {
  search_docs: defineTool({
    name: "search_docs", description: "Keresés a dokumentációban.", readOnly: true,
    schema: z.object({ query: z.string().min(1), limit: z.number().int().max(20).default(5) }),
    run: async input => index.search(input.query, input.limit),   // input a sémából
  }),
  send_email: defineTool({
    name: "send_email", description: "E-mail küldése.", readOnly: false,
    schema: z.object({ to: z.string().email(), subject: z.string(), body: z.string() }),
    run: async ({ to, subject, body }) => mailer.send(to, subject, body),
  }),
};

type ToolName = keyof typeof tools;                       // "search_docs" | "send_email"
type InputOf<N extends ToolName> = z.infer<(typeof tools)[N]["schema"]>;
type OutputOf<N extends ToolName> = Awaited<ReturnType<(typeof tools)[N]["run"]>>;

async function callTool<N extends ToolName>(name: N, input: InputOf<N>): Promise<OutputOf<N>> {
  const tool: ToolDef<z.ZodTypeAny, unknown> = tools[name];      // belül általános alak
  return tool.run(tool.schema.parse(input), ctx) as Promise<OutputOf<N>>;
}

export interface Tool<I, O> {
  readonly name: string;
  readonly description: string;
  readonly readOnly: boolean;
  run(input: I, ctx: ToolContext): Promise<O>;
}

export abstract class BaseTool<I, O> implements Tool<I, O> {
  abstract readonly name: string;
  abstract readonly description: string;
  readonly readOnly: boolean = false;

  protected abstract execute(input: I, ctx: ToolContext): Promise<O>;

  async run(input: I, ctx: ToolContext): Promise<O> {
    ctx.signal.throwIfAborted();                  // közös szabály minden eszköznek
    return this.execute(input, ctx);
  }
}

export function logged<This, Args extends unknown[], Ret>(
  target: (this: This, ...args: Args) => Promise<Ret>,
  context: ClassMethodDecoratorContext<This, (this: This, ...args: Args) => Promise<Ret>>,
) {
  const name = String(context.name);
  return async function (this: This, ...args: Args): Promise<Ret> {
    const started = performance.now();
    try {
      return await target.call(this, ...args);
    } finally {
      console.log(\`\${name}: \${(performance.now() - started).toFixed(0)} ms\`);
    }
  };
}

export type Result<T, E = Error> = { ok: true; value: T } | { ok: false; error: E };

): Promise<Result<string, ToolError>> {
  const parsed = tool.inputSchema.safeParse(input);
  if (!parsed.success) {
    const issues = parsed.error.issues.map(i => \`\${i.path.join(".")}: \${i.message}\`);
    return { ok: false, error: { kind: "invalid_input", issues } };
  }
  try {
    return { ok: true, value: await tool.run(parsed.data, ctx) };
  } catch (e: unknown) {                               // strict: a catch változója unknown
    if (ctx.signal.aborted) throw e;                   // megszakítás: nem eszközhiba
    if (e instanceof DOMException && e.name === "TimeoutError") {
      return { ok: false, error: { kind: "timeout", afterMs: tool.timeoutMs } };
    }
    const message = e instanceof Error ? e.message : String(e);
    return { ok: false, error: { kind: "failed", message } };
  }
}

export interface ToolDef<S extends z.ZodType = z.ZodType> {
  name: string;
  description: string;
  readOnly: boolean;
  timeoutMs?: number;
  inputSchema: S;
  run(input: z.infer<S>, ctx: ToolContext): Promise<string>;
}

export const defineTool = <S extends z.ZodType>(def: ToolDef<S>): ToolDef<S> => def;

export class ToolRegistry {
  #byName = new Map<string, ToolDef>();

  constructor(tools: ToolDef[]) {
    for (const t of tools) this.#byName.set(t.name, t);
  }

  get(name: string): ToolDef | undefined {
    return this.#byName.get(name);
  }

  specs(): ToolSpec[] {
    return [...this.#byName.values()].map(t => ({
      name: t.name,
      description: t.description,
      input_schema: z.toJSONSchema(t.inputSchema),       // zod 4: a sémából JSON Schema
    }));
  }
}

export class AnthropicClient implements ModelClient {
  readonly #apiKey: string;
  readonly #model: string;

  constructor(apiKey: string, model = "claude-sonnet-5-5") {
    this.#apiKey = apiKey;
    this.#model = model;
  }

  async send(messages: Message[], tools: ToolSpec[], { signal }: { signal: AbortSignal }) {
    const res = await this.#post({ messages, tools, max_tokens: 2048 }, signal);
    return parseReply(await res.json());                  // unknown → séma → ModelReply (13.)
  }

  // stream(): a 8. lépésben

  async #post(body: object, signal: AbortSignal): Promise<Response> {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal,
      headers: {
        "x-api-key": this.#apiKey,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
      },
      body: JSON.stringify({ model: this.#model, ...body }),
    });
    if (!res.ok) throw new ModelHttpError(res.status, await res.text());   // 500-ra nem dob
    return res;
  }
}`,

export type AgentOutcome =
  | { kind: "answered"; text: string; turns: number }
  | { kind: "truncated"; text: string; turns: number }
  | { kind: "turn_limit"; turns: number };

export async function runAgent(userText: string, opts: AgentOptions): Promise<AgentOutcome> {
  const { model, tools, signal, maxTurns = 12 } = opts;     // a default csak undefined-ra lép be
  const ctx: ToolContext = { runId: newRunId(), userId: opts.userId, signal };
  const messages: Message[] = [{ role: "user", content: [{ type: "text", text: userText }] }];

  for (let turn = 1; turn <= maxTurns; turn++) {
    signal.throwIfAborted();
    const reply = await model.send(messages, tools.specs(), { signal });
    messages.push({ role: "assistant", content: reply.content });

    switch (reply.stop_reason) {
      case "end_turn":
        return { kind: "answered", text: textOf(reply), turns: turn };
      case "max_tokens":
        return { kind: "truncated", text: textOf(reply), turns: turn };
      case "tool_use": {
        const uses = reply.content.filter(isToolUse);
        messages.push({ role: "user", content: await runTools(uses, tools, ctx) });
        break;
      }
      default:
        return assertNever(reply.stop_reason);          // új stop_reason: fordítási hiba (10.)
    }
  }
  return { kind: "turn_limit", turns: maxTurns };
}`,

export async function runTools(
  uses: ToolUseBlock[], reg: ToolRegistry, ctx: ToolContext,
): Promise<ToolResultBlock[]> {
  const reads = uses.filter(u => reg.get(u.name)?.readOnly === true);
  const writes = uses.filter(u => reg.get(u.name)?.readOnly !== true);
  const results = new Map<string, ToolResultBlock>();

  const settled = await Promise.allSettled(reads.map(u => handleToolUse(u, reg, ctx)));

  // ami változtat, egyesével, a kért sorrendben
  for (const use of writes) results.set(use.id, await handleToolUse(use, reg, ctx));

  return uses.map(u => results.get(u.id)!);               // a válaszok a kérések sorrendjében
}`,

export async function* sseEvents(body: ReadableStream<Uint8Array>): AsyncGenerator<unknown> {
  const decoder = new TextDecoder();
  let buffer = "";
  for await (const chunk of body) {                       // Node 22: a stream aszinkron iterálható
    buffer += decoder.decode(chunk, { stream: true });
    let cut: number;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {         // egy SSE-esemény: üres sorig
      const frame = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      const data = frame.split("\n").find(line => line.startsWith("data: "));
      if (data) yield JSON.parse(data.slice(6));          // unknown: a hívó ellenőrzi
    }
  }
}

export type StepState =
  | { status: "pending" }
  | { status: "running"; startedAt: number }
  | { status: "done"; output: string }
  | { status: "failed"; error: string };

type Pending = Extract<StepState, { status: "pending" }>;
type Running = Extract<StepState, { status: "running" }>;

export const start = (_: Pending): Running => ({ status: "running", startedAt: Date.now() });
export const finish = (_: Running, output: string): StepState => ({ status: "done", output });
export const fail = (_: Running, error: string): StepState => ({ status: "failed", error });
// start({ status: "done", output: "x" });   // hiba: csak várakozó lépés indítható

export function label(s: StepState): string {
  switch (s.status) {
    case "pending": return "vár";
    case "running": return \`fut \${Math.round((Date.now() - s.startedAt) / 1000)} s óta\`;
    case "done": return "kész";
    case "failed": return \`hiba: \${s.error}\`;
    default: return assertNever(s);
  }
}

export async function runWorkflow(
  steps: [string, StepFn][], input: string, signal: AbortSignal, onProgress: OnProgress,
): Promise<string> {
  let current = input;
  for (const [name, fn] of steps) {
    const running = start({ status: "pending" });
    onProgress(name, running);
    try {
      current = await fn(current, signal);              // egy lépés kimenete a következő bemenete
      onProgress(name, finish(running, current));
    } catch (e: unknown) {
      onProgress(name, fail(running, e instanceof Error ? e.message : String(e)));
      throw e;
    }
  }
  return current;
}`,

type OrchestratorEvents = {
  "run:started": [runId: RunId];
  "run:finished": [runId: RunId, output: string];
  "run:failed": [runId: RunId, error: string];
};

export class Orchestrator extends EventEmitter<OrchestratorEvents> {
  #workers: ChildProcess[] = [];
  #inFlight = new Map<RunId, number>();                  // futás → worker sorszáma
  #next = 0;

  constructor(size: number) {
    super();
    for (let slot = 0; slot < size; slot++) this.#spawn(slot);
  }

  submit(workflow: string, input: string): RunId {
    const runId = newRunId();
    const slot = this.#next++ % this.#workers.length;
    this.#workers[slot]!.send({ kind: "run", runId, workflow, input } satisfies ToWorker);
    this.#inFlight.set(runId, slot);
    this.emit("run:started", runId);
    return runId;
  }

  #spawn(slot: number): void {
    const worker = fork(new URL("./worker.js", import.meta.url));
    worker.on("message", raw => {
      const msg = FromWorker.parse(raw);                  // az IPC is határ (13.)
      const runId = msg.runId as RunId;
      if (msg.kind === "progress") return;
      this.#inFlight.delete(runId);
      if (msg.kind === "finished") this.emit("run:finished", runId, msg.output);
      else this.emit("run:failed", runId, msg.error);
    });
    // worker.on("exit", …): a következő lépésben
    this.#workers[slot] = worker;
  }
}`,

public async Task<AgentOutcome> RunAgentAsync(string userText, CancellationToken ct)
{
    var messages = new List<Message> { Message.User(userText) };
    for (var turn = 1; turn <= MaxTurns; turn++)
    {
        ct.ThrowIfCancellationRequested();                    // signal.throwIfAborted()
        var reply = await model.SendAsync(messages, ct);
        messages.Add(Message.Assistant(reply.Content));

        switch (reply.StopReason)
        {
            case StopReason.EndTurn: return new AgentOutcome.Answered(reply.Text, turn);
            case StopReason.MaxTokens: return new AgentOutcome.Truncated(reply.Text, turn);
            case StopReason.ToolUse:
                var uses = reply.Content.OfType<ToolUseBlock>();
                var results = await Task.WhenAll(uses.Select(u => HandleAsync(u, ct)));
                messages.Add(Message.User(results));          // Promise.all megfelelője
                break;
        }
    }
    return new AgentOutcome.TurnLimit(MaxTurns);
}

private async Task<Block> HandleAsync(ToolUseBlock use, CancellationToken ct)
{
    using var linked = CancellationTokenSource.CreateLinkedTokenSource(ct);   // AbortSignal.any
    linked.CancelAfter(TimeSpan.FromSeconds(30));                             // AbortSignal.timeout

    catch (OperationCanceledException) when (!ct.IsCancellationRequested)
    {

    }

    n.text.split("\n").forEach((s, i) => txt(g, -w/2 + 9, -h/2 + 17 + i*16, s, "lbl"));
  } else if (n.kind === "group"){
    el("rect", {x:-w/2, y:-h/2, width:w, height:h, rx:12, class:"shape"}, g);
    if (n.label){
      const pos = n.labelPos || "tl", right = pos[1] === "r", bottom = pos[0] === "b";
      txt(g, right ? w/2 - 12 : -w/2 + 12, bottom ? h/2 - 9 : -h/2 + 17, n.label, "glbl", right ? "end" : "start");
    }
  } else if (n.kind === "timeline"){
    el("rect", {x:-w/2, y:-h/2, width:w, height:h, style:"fill:transparent;stroke:none"}, g);
    el("line", {x1:-w/2, y1:-9, x2:w/2, y2:-9, class:"axis"}, g);
    el("path", {d:`M${w/2-9},-14 L${w/2},-9 L${w/2-9},-4`, class:"axis"}, g);
    (n.ticks || []).forEach(t => {
      const x = -w/2 + t.f*w;
      el("line", {x1:x, y1:-16, x2:x, y2:-2, class:"tick" + (t.strong ? " strong" : "")}, g);
      txt(g, x, 15, t.label, "tl" + (t.strong ? " strong" : ""), "middle");
    });
  } else {
    el("rect", {x:-w/2, y:-h/2, width:w, height:h, rx:7, class:"shape"}, g);
    txt(g, -w/2 + 11, -h/2 + 20, n.title, "ttl");
    if (n.sub) txt(g, -w/2 + 11, -h/2 + 35, n.sub, "sub");
    const lines = (n.lines || []).map(G.lt);
    if (lines.length){
      const sep = -h/2 + (n.sub ? 44 : 30);
      el("line", {x1:-w/2, y1:sep, x2:w/2, y2:sep, class:"sep"}, g);
      lines.forEach((l, i) => {
        const y = sep + 19 + i*19;
        txt(g, -w/2 + 11, y, l.t, "ln" + (l.tone ? " lt-" + l.tone : ""));
        if (l.chip){
          const cw = l.chip.length*6.6 + 14, cx = w/2 - 8 - cw;
          const tone = l.chipTone ? " ct-" + l.chipTone : "";
          el("rect", {x:cx, y:y - 12, width:cw, height:16, rx:8, class:"chip" + tone}, g);
          txt(g, cx + cw/2, y - 0.5, l.chip, "chipt" + tone, "middle");
        }
      });
    }
  }
}

function later(fn, ms){ timeouts.push(setTimeout(fn, ms)); }
function clearTimers(){
  timeouts.forEach(clearTimeout); rafs.forEach(cancelAnimationFrame);
  timeouts = []; rafs = [];
}
const keyOf = n => JSON.stringify([n.kind, n.title, n.sub, n.lines, n.label, n.labelPos, n.text, n.tone, n.w, n.h, n.ticks]);

function ping(id){
  const rec = nodeMap.get(id);
  if (!rec || reduceMQ.matches) return;
  rec.g.classList.add("ping");
  later(() => rec.g.classList.remove("ping"), 700);
}

function clearStage(){
  clearTimers();
  nodeMap.forEach(r => r.g.remove());
  nodeMap.clear();
  [gEdges, gMsgs].forEach(g => { while (g.firstChild) g.removeChild(g.firstChild); });
}

function renderScene(step){
  clearTimers();
  const reduce = reduceMQ.matches;
  const sc = step.scene || {}, nodes = sc.nodes || [];
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  const present = new Set();

  nodes.forEach(n => {
    present.add(n.id);
    const layer = n.kind === "group" ? gGroups : gNodes;
    let rec = nodeMap.get(n.id);
    if (rec && rec.removing) rec.removing = false;
    let fresh = false;
    if (rec && rec.g.parentNode !== layer) layer.appendChild(rec.g);
    if (!rec){
      const g = el("g", {}, layer);
      g.style.transition = "none";
      g.style.transform = `translate(${n.x}px,${n.y}px)`;
      g.style.opacity = "0";
      rec = {g, key:null}; nodeMap.set(n.id, rec); fresh = true;
      void g.getBoundingClientRect();
      g.style.transition = "";
    }
    const key = keyOf(n);
    if (rec.key !== key){ drawNode(rec.g, n); rec.key = key; }
    rec.g.dataset.id = n.id;
    rec.g.style.transform = `translate(${n.x}px,${n.y}px)`;
    if (n.at != null && !reduce){
      rec.g.style.opacity = "0";
      later(() => { rec.g.style.opacity = "1"; ping(n.id); if (n.code) setExec(n.code); }, n.at + BASE);
    } else {
      if (fresh && !reduce) later(() => { rec.g.style.opacity = "1"; }, 60);
      else rec.g.style.opacity = "1";
      if (n.at != null && n.code && reduce) setExec(n.code);
    }
    if (n.toneAt){
      const swap = () => {
        const n2 = Object.assign({}, n, {tone:n.toneAt[1]});
        drawNode(rec.g, n2); rec.key = keyOf(n2); refreshHl();
      };
      if (reduce) swap(); else later(swap, n.toneAt[0] + BASE);
    }
  });
  nodeMap.forEach((rec, id) => {
    if (present.has(id)) return;
    rec.removing = true;
    rec.g.style.opacity = "0";
    setTimeout(() => { if (rec.removing){ rec.g.remove(); if (nodeMap.get(id) === rec) nodeMap.delete(id); } }, reduce ? 0 : 480);
  });

  while (gEdges.firstChild) gEdges.removeChild(gEdges.firstChild);
  (sc.edges || []).forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    const gm = G.geom(a, b, e.curve || 0, e.fromLine, e.toLine, e.loop);
    const g = el("g", {class:"edge e-" + (e.kind || "ok")}, gEdges);
    if (e.id) g.dataset.id = e.id;
    el("path", {d:gm.d, class:"ep"}, g);
    if (e.label) txt(g, gm.lx, gm.ly + 4, e.label, "elbl", "middle");
    if (!reduce) g.style.animationDelay = ((e.at || 0) + BASE) + "ms";
    if (e.until != null){
      if (reduce) g.classList.add("gone");
      else later(() => g.classList.add("gone"), e.until + BASE);
    }
  });

  while (gMsgs.firstChild) gMsgs.removeChild(gMsgs.firstChild);
  (sc.msgs || []).forEach(m => {
    const a = byId[m.from], b = byId[m.to];
    if (!a || !b) return;
    const gm = G.geom(a, b, m.curve || 0, m.fromLine, m.toLine, m.loop);
    const g = el("g", {class:"msg m-" + (m.kind || "ok")}, gMsgs);
    const p = el("path", {d:gm.d, class:"mp"}, g);
    if (m.label) txt(g, gm.lx, gm.ly - 7, m.label, "mlbl", "middle");
    const dot = el("circle", {r:5, class:"mdot", cx:-20, cy:-20}, g);
    if (reduce){ g.classList.add("done"); if (m.code) setExec(m.code); return; }
    const len = p.getTotalLength(), dur = m.dur || 750;
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    g.classList.add("wait");
    later(() => {
      g.classList.remove("wait"); g.classList.add("run");
      if (m.code) setExec(m.code);
      const t0 = performance.now();
      const tick = now => {
        const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - k, 3);
        p.style.strokeDashoffset = len*(1 - e);
        const pt = p.getPointAtLength(len*e);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
        if (k < 1) rafs.push(requestAnimationFrame(tick));
        else {
          g.classList.remove("run"); g.classList.add("done");
          p.style.strokeDasharray = ""; p.style.strokeDashoffset = "";
          ping(m.to);
        }
      };
      rafs.push(requestAnimationFrame(tick));
    }, (m.at || 0) + BASE);
  });
}

/* ---------- Kód ---------- */

const esc = HL.esc;
/* A lépés kódja: egy szöveg (nyelve a lépés, az állomás vagy az út alapja), vagy fájlok listája. */
function codeParts(step, st){
  const def = step.lang || st.lang || C.lang || "cs";
  const norm = c => String(c || "").replace(/^\n/, "").replace(/\s+$/, "").split("\n");
  if (Array.isArray(step.code)) return step.code.map(p => ({file:p.file, lang:p.lang || def, lines:norm(p.code)}));
  return [{file:step.file, lang:def, lines:norm(step.code)}];
}
function renderCode(parts){
  codeLines = []; lineEls = [];
  while (pre.firstChild) pre.removeChild(pre.firstChild);
  const multi = parts.length > 1;
  const label = l => HL.LABELS[l] || l;
  const head = $("codelang");
  if (multi) head.textContent = [...new Set(parts.map(p => label(p.lang)))].join(" + ");
  else head.innerHTML = (parts[0].file ? `<span class="cfile">${esc(parts[0].file)}</span>` : "") + esc(label(parts[0].lang));
  parts.forEach(p => {
    if (multi){
      const f = document.createElement("div");
      f.className = "cf";
      f.innerHTML = `<b>${esc(p.file || "")}</b>${esc(label(p.lang))}`;
      pre.appendChild(f);
    }
    const html = HL.highlight(p.lines, p.lang);
    p.lines.forEach((s, i) => {
      const k = lineEls.length;
      const d = document.createElement("div");
      d.className = "cl";
      d.innerHTML = `<span class="no">${i + 1}</span><span class="tx">${html[i] || " "}</span>`;
      d.addEventListener("pointerenter", () => setPairClass("hv", linePairs[k]));
      d.addEventListener("pointerleave", () => setPairClass("hv", []));
      pre.appendChild(d);
      codeLines.push(s); lineEls.push(d);
    });
  });
  fitCode();
}
function setExec(matches){
  lineEls.forEach((l, i) => l.classList.toggle("exec", matches.some(s => codeLines[i].includes(s))));
}

/* A kód doboza a tartalmához méreteződik, és jobbra kilóghat az ablak széléig (16 px margóval).
   A lap egyszer, az út leghosszabb kódsora alapján dönt: ha az a rajz mellett, kilógva is elfér
   (szükség esetén keskenyebb rajzzal, legfeljebb 564 px-ig, ahol a rajz még görgetés nélkül elfér, és kisebb betűvel, legfeljebb 11 px-ig),
   a kód a rajz mellett marad; ha nem, a kód a rajz alá kerül, teljes szélességben. Lépésenként a fitCode() a biztonsági háló:
   ha mégsem fér el, kisebb betű, végső esetben (keskeny képernyőn) törik a hosszú sor. */
const CODE_FONT = 12.5, CODE_MIN = 11, CODE_GUTTER = 16, CODE_FIXED = 56, DIAGRAM_MIN = 564, SLACK = 0.99;
const maxChars = Object.values(OOP.stations).reduce((m, st) => st.tracks.reduce((m2, tr) => tr.steps.reduce((m3, step) =>
  codeParts(step, st).reduce((m4, p) => p.lines.reduce((m5, l) => Math.max(m5, l.length), m4), m3), m2), m), 0);
let codeFont = CODE_FONT, meter = null;
function charWidth(){
  if (!meter){
    const c = document.createElement("canvas");
    meter = c.getContext ? c.getContext("2d") : null;
    if (!meter) return 0;
  }
  meter.font = `${CODE_FONT}px ${getComputedStyle(pre).fontFamily}`;
  return meter.measureText("0".repeat(50)).width / 50;
}
function codeRoom(box){
  return Math.floor(document.documentElement.clientWidth - CODE_GUTTER - box.getBoundingClientRect().left);
}
function layoutCode(){
  const box = pre.parentNode, work = box && box.parentNode;
  if (!work || !document.documentElement || !window.getComputedStyle) return;
  work.classList.remove("stack");
  work.style.gridTemplateColumns = "";
  const cw = charWidth();
  if (cw && maxChars){
    const span = maxChars*cw, diagram = work.firstElementChild;
    const roomNow = () => (codeRoom(box) - CODE_FIXED)*SLACK;
    let room = roomNow();
    const side = getComputedStyle(work).gridTemplateColumns.trim().split(/\s+/).length > 1;
    if (side && room < span && diagram.getBoundingClientRect().width > DIAGRAM_MIN){
      work.style.gridTemplateColumns = DIAGRAM_MIN + "px minmax(0,1fr)";
      room = roomNow();
    }
    if (side && room < span*CODE_MIN/CODE_FONT){
      work.style.gridTemplateColumns = "";
      work.classList.add("stack");
      room = roomNow();
    }
    codeFont = Math.max(CODE_MIN, Math.min(CODE_FONT, Math.floor(CODE_FONT*room/span*4)/4));
  }
  fitCode();
}
function fitCode(){
  const box = pre.parentNode, root = document.documentElement;
  if (!box || !root || !box.getBoundingClientRect) return;
  box.classList.remove("wrap");
  box.style.width = "";
  let size = codeFont;
  pre.style.fontSize = size === CODE_FONT ? "" : size + "px";
  const avail = codeRoom(box);
  if (!(avail > 0)) return;
  while (box.offsetWidth > avail && size > CODE_MIN){
    size = Math.max(CODE_MIN, size - 0.25);
    pre.style.fontSize = size + "px";
  }
  if (box.offsetWidth > avail){
    box.classList.add("wrap");
    box.style.width = avail + "px";
  }
}
let fitPending = false;
function refit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; layoutCode(); });
}
if (window.addEventListener) window.addEventListener("resize", refit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

try { if (localStorage.getItem(NAV_KEY) === "min") setNav(true); } catch (e) {}

/* ---------- Párok: rajz ↔ kód ---------- */

function applyPairs(step){
  curPairs = step.pairs || [];
  linePairs = codeLines.map(line => curPairs.map((p, pi) => p.match.some(s => line.includes(s)) ? pi : -1).filter(pi => pi >= 0));
  refreshHl();
}
function refreshHl(){
  setPairClass("hl", curPairs.map((p, i) => p.on ? i : -1).filter(i => i >= 0));
}
function setPairClass(cls, idxs){
  stage.querySelectorAll("." + cls).forEach(e => e.classList.remove(cls));
  lineEls.forEach(l => l.classList.remove(cls));
  (idxs || []).forEach(pi => {
    const p = curPairs[pi];
    if (!p) return;
    p.nodes.forEach(id => stage.querySelectorAll(`[data-id="${id}"]`).forEach(e => e.classList.add(cls)));
    lineEls.forEach((l, i) => { if ((linePairs[i] || []).includes(pi)) l.classList.add(cls); });
  });
}
function pairsOf(id){ return curPairs.map((p, i) => p.nodes.includes(id) ? i : -1).filter(i => i >= 0); }
stage.addEventListener("pointerover", e => {
  const t = e.target.closest("[data-id]");
  setPairClass("hv", t ? pairsOf(t.dataset.id) : []);
});
stage.addEventListener("pointerleave", () => setPairClass("hv", []));

/* ---------- Állomás, sáv, lépés ---------- */

function md(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
const regOf = id => C.stations.find(s => s.id === id);
const available = () => C.stations.filter(s => OOP.stations[s.id]);
function eyebrowOf(num){
  return (C.special || {})[num] || num + ". állomás";
}
function placeOf(num){
  return (C.placeNames || {})[num] || eyebrowOf(num);
}
function trackOf(st, tid){ return st.tracks.find(t => t.id === tid) || st.tracks[0]; }
function trackSub(st, tr){
  if (tr.sub) return tr.sub;
  if (tr.back != null) return `a fő vonal ${tr.back + 1}. lépéséhez`;
  return "";
}

function renderSidebar(){
  const ol = $("stations");
  ol.innerHTML = "";
  C.stations.forEach(s => {
    if (s.section){
      const h = document.createElement("li");
      h.className = "sec"; h.textContent = s.section;
      ol.appendChild(h);
    }
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "st" + (cur && cur.station === s.id ? " on" : "") + (s.sep ? " sep" : "");
    b.innerHTML = `<span class="n">${esc(s.num)}</span><span class="t">${esc(s.short)}</span>`;
    b.title = s.short;
    if (!OOP.stations[s.id]) b.disabled = true;
    else b.addEventListener("click", () => go(s.id, null, 0));
    if (cur && cur.station === s.id) b.setAttribute("aria-current", "page");
    li.appendChild(b);
    ol.appendChild(li);
  });
  const missing = C.stations.length - available().length;
  $("stfoot").textContent = missing ? `${missing} állomás még készül.` : (C.foot || "");
}

function mapItems(){
  const M = C.map, all = [];
  const walk = it => { all.push(it); (it.children || []).forEach(walk); };
  (M.items || []).forEach(walk);
  (M.virtual || []).forEach(it => all.push(it));
  return all;
}
function renderMap(st){
  const M = C.map;
  $("modmap").hidden = !M;
  if (!M) return;
  const on = new Set(st.map || []);
  const all = M.all && on.has(M.all);
  const lit = k => all || on.has(k);
  const num = it => it.st ? `<i>${esc(it.st)}</i>` : "";
  const item = it => it.children
    ? `<div class="mm-agg${lit(it.key) ? " on" : ""}"><span class="mm-cap">${esc(it.label)}${num(it)}</span>${it.children.map(item).join("")}</div>`
    : `<span class="mchip${lit(it.key) ? " on" : ""}">${esc(it.label)}${num(it)}</span>`;
  $("mm").className = "mm" + (all || (M.outline && on.has(M.outline)) ? " on" : "");
  $("mm").innerHTML = (M.items || []).map(item).join("");
  let note = st.mapNote;
  if (!note){
    const byKey = {}; mapItems().forEach(it => byKey[it.key] = it);
    const names = [...on].filter(k => byKey[k]).map(k => byKey[k].label);
    note = names.length ? "ezen az állomáson: " + names.join(", ") : "";
  }
  $("mmlabel").textContent = M.title + (note ? " · " + note : "");
  $("modmap").setAttribute("aria-label", M.title);
}

function renderStation(st){
  const r = regOf(st.id);
  $("eyebrow").textContent = eyebrowOf(r.num);
  $("sttitle").textContent = st.title;
  $("goal").textContent = st.goal || "";
  renderMap(st);

}

function render(){

    button("back-link", `← Vissza: ${esc(place)}, ${f.idx + 1}. lépés`, () => { const f2 = returnTo.from; returnTo = null; go(f2.station, f2.track, f2.idx); });
  }
  if (tr.id === st.tracks[0].id && cur.idx === tr.steps.length - 1){
    const av = available(), i = av.findIndex(s => s.id === cur.station);
    const nx = av[i + 1];
    if (nx) button("next-link", `<span class="lab">Az állomás végén</span>Tovább: ${esc(eyebrowOf(nx.num).toLowerCase())}, ${esc(nx.short.toLowerCase())} →`, () => go(nx.id, null, 0));
  }
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Vidd az egeret egy dobozra, nyílra vagy kódsorra: a párja is kivilágít. Lapozni a ← → billentyűkkel is lehet.";
  links.appendChild(hint);

  renderCode(codeParts(step, st));
  applyPairs(step);
  renderScene(step);
  refreshHl();
  stage.setAttribute("aria-label", `${st.title}, ${tr.name}, ${cur.idx + 1}. lépés: ${step.title}`);
}

function go(sid, tid, idx, opts){
  const st = OOP.stations[sid];
  if (!st) return;
  const tr = trackOf(st, tid);
  idx = Math.max(0, Math.min(tr.steps.length - 1, idx | 0));
  const stationChanged = !cur || cur.station !== sid;
  if (stationChanged || cur.track !== tr.id) clearStage();
  if (opts && opts.from) returnTo = {from:opts.from, target:sid};
  else if (returnTo && sid !== returnTo.target) returnTo = null;
  cur = {station:sid, track:tr.id, idx};
  if (stationChanged){
    renderStation(st);
    if (!opts || !opts.initial) window.scrollTo({top:0, behavior:reduceMQ.matches ? "auto" : "smooth"});
  }
  render();
  try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) {}
}

$("prev").addEventListener("click", () => go(cur.station, cur.track, cur.idx - 1));
$("next").addEventListener("click", () => go(cur.station, cur.track, cur.idx + 1));
$("replay").addEventListener("click", () => {
  const st = OOP.stations[cur.station], step = trackOf(st, cur.track).steps[cur.idx];
  lineEls.forEach(l => l.classList.remove("exec"));
  renderScene(step); refreshHl();
});
document.addEventListener("keydown", e => {
  if (!cur || (e.target.closest && e.target.closest("input,textarea,select"))) return;
  if (e.key === "ArrowRight") go(cur.station, cur.track, cur.idx + 1);
  else if (e.key === "ArrowLeft") go(cur.station, cur.track, cur.idx - 1);
});

/* ---------- Indulás ---------- */

const av = available();
if (!av.length){
  $("main").innerHTML = '<p class="empty">Még nincs betöltött állomás.</p>';
  return;
}
let start = {station:av[0].id, track:null, idx:0};
try {
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s && OOP.stations[s.station]) start = s;
} catch (e) {}
const hash = (location.hash || "").replace(/^#/, "");
if (hash && OOP.stations[hash]) start = {station:hash, track:null, idx:0};
go(start.station, start.track, start.idx, {initial:true});
layoutCode();
window.__oop = {go, cur:() => cur, layout:layoutCode};
})();
</script>
